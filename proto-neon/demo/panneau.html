<script>
/* LA DÉMO DU VOYAGE (proto-neon/demo/index.html) — en attendant que 79-jeu.js branche N.aventure lui-même
   (refonte/lots/demandes.md, « LE branchement qui relie tout »), cette page relie l'aventure au VRAI jeu :
   l'ouverture du jeu → le choix ELLE / LUI → connexion → 1976 → fissure → 1982 → le vrai jeu néon (vague 1) ;
   au début des vagues 3, 4 et 5, l'aventure reprend la main pour les films d'époque (profondeur, warp, espace), et
   après « espace », pour 2975 (N.cosmos : l'espace profond et le vaisseau amiral, qui mène droit à la fin) ;
   à la victoire, pour la fin du personnage ; quand les deux sont finis, retrouvailles et teaser SNAKE 3019.
   Une fois l'aventure finie, elle recommence à l'écran de choix (l'autre personnage). La piste principale se tait
   pendant le choix, 1976 et 1982, qui jouent leur propre musique. Cette page est une démonstration : le jeu
   (index.html) n'en dépend pas. window.__demo expose l'état pour les essais. */
(function () {
  var N = window.__N, g = null, u0 = null, d0 = null, t0 = null;
  var parti = false, neon = false, victoire = false, vu = {}, musiqueEteinte = false, nAventures = 0;
  function musique(on) {
    try {
      if (!N.music) return;
      if (!on && N.music.stop && !musiqueEteinte) { N.music.stop(); musiqueEteinte = true; }
      if (on && musiqueEteinte && N.music.start) { N.music.start(); musiqueEteinte = false; }
    } catch (e) {}
  }
  function lancer() {
    parti = true; neon = false; victoire = false; vu = {}; nAventures++;
    N.aventure.demarrer({
      aJouer: function (info) {
        neon = true;
        if (info && info.premiere) { try { N.game.dbg.vague(1); } catch (e) {} }
      },
      surFin: function () { neon = false; parti = false; }
    });
  }
  /* la main revient à l'aventure aux moments clés du vrai jeu */
  function surveiller() {
    var v = N.dir && N.dir.vague ? N.dir.vague() : 0, et = N.game.etat();
    var etapes = [[3, 'profondeur'], [4, 'warp'], [5, 'espace']];
    for (var i = 0; i < etapes.length; i++) {
      var e = etapes[i];
      if (v >= e[0] && !vu[e[1]] && et === 'jeu') { vu[e[1]] = 1; if (N.aventure.reprendre(e[1])) { neon = false; return; } }
    }
    if (et === 'victoire') victoire = true;
    if (et === 'fin' && victoire) { victoire = false; if (N.aventure.reprendre('fin')) neon = false; }
  }
  /* en 2975, N.cosmos a sa propre lunette : on cache à N.warp les ennemis du jeu gelé, pour qu'il ne les verrouille pas */
  var vraie = null;
  function cache(on) {
    var E = N.ennemis; if (!E) return;
    if (on && vraie === null) { vraie = E.list; E.list = []; }
    else if (!on && vraie !== null) { E.list = vraie; vraie = null; }
  }
  function brancher() {
    g = N.game; u0 = g.update; d0 = g.draw; t0 = g.drawTop;
    g.update = function (dt) {
      if (!parti) lancer();
      if (N.aventure.actif()) {
        var et = N.aventure.etape ? N.aventure.etape() : '';
        if (et === 'choix' || et === '1976' || et === '1982' || et === '2975') musique(false);
        cache(et === '2975');
        N.aventure.update(dt); return;
      }
      cache(false);
      if (neon) { musique(true); u0.call(g, dt); surveiller(); }
    };
    g.draw = function () { if (N.aventure.actif() || !neon) { N.aventure.draw(); return; } d0.call(g); };
    g.drawTop = function () { if (!N.aventure.actif() && neon) t0.call(g); };
    /* 90-boot.js dessine lui-même l'interface (écrans, HUD, films de 60-intro) par-dessus le jeu :
       on la tait tant que l'aventure a la main, sinon le titre « SNAKE 2975 » couvrirait 1976 et 1982 */
    ['ui', 'hud', 'intro'].forEach(function (k) {
      var m = N[k]; if (!m || !m.draw) return;
      var d = m.draw; m.draw = function () { if (N.aventure.actif() || !neon) return; return d.apply(m, arguments); };
    });
    window.__demo = { etat: function () { return { parti: parti, neon: neon, etape: N.aventure.etape ? N.aventure.etape() : null, aventures: nAventures, jeu: N.game.etat(), vague: N.dir && N.dir.vague ? N.dir.vague() : 0 }; } };
  }
  if (document.readyState === 'complete') setTimeout(brancher, 30); else window.addEventListener('load', function () { setTimeout(brancher, 30); });
})();
</script>
