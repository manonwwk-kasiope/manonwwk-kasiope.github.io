    '1.11.1.11.11.1..',
    '1...1.1.1...1.1.',
    '11.1..1.11.1..1.'

  /* voicings de la nappe en ROLES : 'T' la tierce de l'accord (3 ou 4 selon sa qualite), 'U' la tierce

  /* ================================ le moteur ================================
     build() construit un moteur complet sur un contexte quelconque. Le jeu en instancie un sur un
     AudioContext ; la preuve en instancie un second sur un OfflineAudioContext. Le code de synthese
     et de composition est le MEME : la preuve mesure donc bien ce qui est joue. */
  function build(ctx, offline, mute) {

    var sr = ctx.sampleRate;
    var muteMus = mute === 'music', muteSfx = mute === 'sfx';
    var mrnd = mk(musicSeed());                      /* choix musicaux */
    var nrnd = mk((musicSeed() ^ 0x5bf03635) >>> 0);  /* bruit : flux separe, voir l'entete */
    var srnd = mk((musicSeed() ^ 0x2c1b3c6d) >>> 0);  /* sons d'information : flux separe */

       hold() fige un parametre a l'instant t en gardant sa valeur : cancelScheduledValues seul annulerait
       aussi une rampe en cours, et la valeur sauterait. rampTo() enchaine les rampes de mesure en mesure
       SANS rien annuler : la rampe precedente finit exactement ou la suivante commence. */
    function hold(p, t) {
      if (typeof p.cancelAndHoldAtTime === 'function') {
        try { p.cancelAndHoldAtTime(t); p.__v = undefined; return; } catch (e) { /* repli ci-dessous */ }
      }
      var v = p.value; p.cancelScheduledValues(t); p.setValueAtTime(v, t); p.__v = v;
    }
    function rampTo(p, v, t, dur) {
      var from = p.__v === undefined ? p.value : p.__v;
      p.setValueAtTime(from, t);
      p.linearRampToValueAtTime(v, t + dur);
      p.__v = v;
    }
    function glide(p, v, tc) {                 /* vers v, en exponentielle de constante tc, depuis maintenant */
      var now = ctx.currentTime;

      if (tc > 0) p.setTargetAtTime(v, now, tc); else p.setValueAtTime(v, now);
    }

    /* ---- genou doux : lineaire jusqu'a T, plafond a C. Un gain de 0,5 en amont etend la courbe a
       +-2 : une crete jusqu'a +6 dB au-dessus de la pleine echelle est encore arrondie, pas ecretee. */
    function kneeCurve(n) {

      for (var i = 0; i < n; i++) {

        var y = a <= T ? a : T + (C - T) * Math.tanh((a - T) / (C - T));
        c[i] = x < 0 ? -y : y;
      }
      return c;
    }

    /* ---- bus ---- */
    var master = ctx.createGain(); master.gain.value = MIX.master * 0.5;
    var shaper = ctx.createWaveShaper();
    shaper.curve = kneeCurve(4097); shaper.oversample = '2x';
    var gate = ctx.createGain(); gate.gain.value = 1;          /* coupure et veille */
    master.connect(shaper); shaper.connect(gate); gate.connect(ctx.destination);

    var musicBus = ctx.createGain();        /* somme des quatre couches, sec */
    var musicLevel = ctx.createGain(); musicLevel.gain.value = muteMus ? 0 : MIX.music;
    var musicDuck = ctx.createGain(); musicDuck.gain.value = 1;
    var OPEN = Math.min(20000, sr * 0.45);
    var muffle = ctx.createBiquadFilter(); muffle.type = 'lowpass'; muffle.frequency.value = OPEN; muffle.Q.value = 0.6;
    musicBus.connect(musicLevel); musicLevel.connect(musicDuck); musicDuck.connect(muffle); muffle.connect(master);

    var sfxBus = ctx.createGain(); sfxBus.gain.value = muteSfx ? 0 : MIX.sfx;
    sfxBus.connect(master);

    var LAY = {};

      var g = ctx.createGain();
      g.gain.value = (k === 'pad' || k === 'bass') ? MIX[k] : 0;
      g.connect(musicBus); LAY[k] = g;
    });

    /* ---- reverberation : reseau de retards retroactifs. Pas de fichier d'impulsion, pas de
       convolution : quatre peignes passe-bas, c'est la grosse plaque de 1984 pour un cout negligeable
       sur telephone. Sa sortie passe par l'etouffoir : en pause, la queue s'assourdit avec la musique. ---- */
    var revIn = ctx.createGain(), revOut = ctx.createGain(); revOut.gain.value = 1.0;
    var revMusIn = ctx.createGain(); revMusIn.gain.value = muteMus ? 0 : 1;
    var revSfxIn = ctx.createGain(); revSfxIn.gain.value = muteSfx ? 0 : 1;
    revMusIn.connect(revIn); revSfxIn.connect(revIn);
    (function () {
      var pre = ctx.createDelay(0.2); pre.delayTime.value = 0.018;
      revIn.connect(pre);
      var merge = ctx.createChannelMerger(2);
      var combs = [[0.0431, 0.80], [0.0537, 0.787], [0.0719, 0.773], [0.0977, 0.761]];

        var fb = ctx.createGain(); fb.gain.value = combs[i][1];

        pre.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d);

      merge.connect(tilt); tilt.connect(revOut);

    function send(from, amt, dom) {
      if (amt <= 0) return null;
      var g = ctx.createGain(); g.gain.value = amt; from.connect(g);

    }
    /* ---- tampon de bruit : deux secondes, deterministe, flux dedie ---- */
    var noiseBuf = (function () {
      var n = Math.floor(sr * 2), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = nrnd() * 2 - 1;

    }

    /* ---- enveloppes ---- */
    function pluck(p, t, a, d, peak) {
      p.setValueAtTime(0.0001, t);

       Voix permanentes : deux dents de scie desaccordees par voix, retunees a chaque accord par

        padVoices[i].b.frequency.setTargetAtTime(f, t, 0.075);

    /* ================================ basse ================================ */
    function bassNote(t, midi, dur, vel) {

      var sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = hz(midi);

    /* ================================ lead ================================
       Dent de scie et triangle (plus de carre : ses harmoniques impaires piquaient entre 2 et 5 kHz),

    /* ================================ esquive ================================
       Les sons d'information passent AU-DESSUS : le bus musical sec plonge brievement. Que des

      p.setTargetAtTime(1, t + 0.05, Math.max(0.02, rel / 3));

    /* ================================ sons d'information ================================ */
    /* une note de la pentatonique mineure de la tonalite courante, ramenee a +-6 demi-tons de la */
    function keyNote(base, idx) {

      var g = ctx.createGain(); pluck(g.gain, t, a, d, peak);
      if (lpf) { var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf; lp.Q.value = 0.7; o.connect(lp); lp.connect(g); }
      else o.connect(g);

      n.connect(fl); fl.connect(g); g.connect(sfxBus);
      return g;

    function vary(x) { return 1 + (srnd() - 0.5) * x; }

    /* chaque son rend sa duree ; g est le gain d'usure (1 pour un son isole) */
    var SFX = {
      tir: function (t, o, g) {
        var k = (o.pitch | 0) % 5; if (k < 0) k += 5;
        var f = hz(keyNote(69, [0, 2, 1, 3, 4][k])) * vary(0.012), d = 0.048 + srnd() * 0.016;
        voice(t, 'triangle', f, f * 0.42, d, 0.002, d, 0.08 * g, 1700);
        burst(t, 'bandpass', 1000 + srnd() * 300, 0.9, 0.001, 0.016, 0.027 * g);
        return d + 0.03;
      },
      kill: function (t, o, g) {

        /* l'octave carree, filtree sous 1,8 kHz : la presence dans les mediums, ou le telephone porte */

        burst(t, 'bandpass', 1000 + srnd() * 250, 0.9, 0.001, 0.05, 0.17 * g);
        voice(t, 'sine', 160, 55, 0.08, 0.002, 0.1, 0.04 * g, 0);

      },
      bigkill: function (t, o, g) {
        var v = vary(0.12);

        voice(t, 'triangle', 260 * v, 90, 0.3, 0.003, 0.34, 0.30 * g, 0);       /* le coup, dans les mediums */
        var n = noise(t, 1.4, srnd), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.9;
        lp.frequency.setValueAtTime(2000 * v, t); lp.frequency.exponentialRampToValueAtTime(110, t + 1.15);

      rows[7] = 'rmmormrmsomms';

  /* la sentinelle : losange, œil central dans une étoile sombre à quatre branches ; la pupille

  var SENT = [

    '.....rmm.....',
    '....rmmmm....',
    '...rmmommm...',
    '..rmmmommmm..',
    '.rmmmorommmm.',
    'rmmoorxroomms',
    '.mmmmorommms.',
    '..mmmmommms..',

    '....mmmss....',

  /* la mine : sphère à piques, cœur lumineux dans une coque sombre ; les piques tournent d'un

  /* LE COLOSSE — d'après le panneau boss : géant mécanique, crête de lames, œil unique, épaulières
     hérissées, bras pendants terminés en griffes. Construit en PLAQUES d'armure : chaque plaque est un
     polygone (moitié gauche, symétrisée), posée dans l'ordre de profondeur ; un joint d'un pixel en nuit
     profonde sépare deux plaques, et chaque plaque est éclairée par le haut (arête haute rose pâle,

  var CW = 47, CH = 47;

    /* [polygone, base, symétrique ?] — base : 'm' magenta (avant), 's' sang (en retrait) */
    [[[3, 21], [10.5, 21], [10.5, 29], [3, 29]], 's'],                                   /* bras */
    [[[0.5, 28.5], [11.5, 28.5], [12.5, 38.5], [0, 38.5]], 'm'],                           /* avant-bras */
    [[[0, 38], [12.5, 38], [11.5, 41], [10, 45], [8.5, 41], [7, 45], [5.5, 41], [4, 45], [2.5, 41], [1, 45], [0, 41]], 's'], /* griffes */
    [[[15.5, 40.5], [22, 40.5], [21.5, 47], [15, 47]], 's'],                              /* jambes */
    [[[13.5, 34.5], [23.5, 34.5], [23.5, 41], [15.5, 41.5]], 'm'],                         /* hanches */
    [[[14, 27], [23.5, 27], [23.5, 35], [16.5, 35]], 's'],                                 /* ventre */
    [[[11.5, 18.5], [23.5, 18.5], [23.5, 27.5], [14, 27.5], [11, 23]], 'm'],                /* poitrine */
    [[[3.5, 10], [6.5, 0.5], [9.5, 9]], 'm'],                                             /* grande lame d'épaule */
    [[[10, 10], [12.5, 3.5], [15, 10]], 'm'],                                              /* petite lame */
    [[[1, 12.5], [4, 7], [16, 8.5], [17.5, 13], [15.5, 20.5], [3, 21.5], [0.5, 17]], 'm'],  /* épaulière */
    [[[1.5, 15], [17, 13.5], [16.5, 16.5], [2, 18]], 's'],                                 /* bande d'épaulière */
    [[[16.5, 1.5], [19.5, 7], [18, 8], [16, 4]], 'm'],                                     /* lame de crête */
    [[[18.5, 17.5], [28.5, 17.5], [30, 20.5], [17, 20.5]], 's', 1],                        /* col */
    [[[16, 8.5], [19, 9], [19, 14.5], [16.5, 12.5]], 's'],                                 /* ailerons du casque */
    [[[19, 5.5], [28, 5.5], [29.5, 9], [28.5, 16], [26, 18.5], [21, 18.5], [18.5, 16], [17.5, 9]], 'm', 1], /* casque */

      if ((dn >= 0 && dn > v) || (rt >= 0 && rt > v && x < 23) || (lf >= 0 && lf > v && x > 23) || (up >= 0 && up > v)) { d[i] = NP; continue; }

    /* arête du masque sous l'œil : une ligne claire, pas une bouche */
    for (x = 22; x <= 23; x++) sym(x, 16, ROSE);

    for (x = 2; x <= 10; x++) { sym(x, 31, NP); sym(x, 34, NP); }
    /* côtes du ventre */
    for (x = 17; x <= 22; x++) { sym(x, 29, NP); sym(x, 32, NP); }

    sym(4, 13, ROSE); sym(13, 12, ROSE); sym(6, 18, ROSE);
    /* le cœur de la poitrine : un losange sombre, allumé par image */
    sym(23, 21, NP); sym(22, 22, NP); sym(23, 22, NP); sym(21, 23, NP); sym(22, 23, NP); sym(23, 23, NP); sym(22, 24, NP); sym(23, 24, NP); sym(23, 25, NP);

  function genColosse(variant, f) {

  var TIRE = {

  /* ---------------------------------------------------------------------------------------------- */

    'ajjwjja',
    'ajwjjja',
    'aajjjaa',

  /* ---------------------------------------------------------------------------------------------- */

  var ICO = {

  /* repli : un nom inconnu ne casse rien, il se voit */

  /* ---------------------------------------------------------------------------------------------- */
  /* registre                                                                                         */
  /* ---------------------------------------------------------------------------------------------- */
  function dirOf(v, def) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return def;
    return ((n % 16) + 16) % 16;
  }

    tete: { fr: 3, gen: function (v, f) { return genTete(dirOf(v, 0), f); } },
    corps: { fr: 3, gen: function (v, f) { var d = parseInt(v, 10); if (!(d === 3 || d === 5 || d === 7 || d === 9)) d = 9; return genCorps(d, f); } },
    queue: { fr: 3, gen: function (v, f) { return genCorps(3, f); } },
    tir: { fr: 2, gen: function (v, f) { return genTir(dirOf(v, 0), f); } },

    fleche: { fr: 2, gen: function (v, f) { return genFleche(dirOf(v, 0), f); } },
    tourelle: { fr: 2, gen: function (v, f) { return genTourelle(v, f); } },
    sentinelle: { fr: 4, gen: function (v, f) { return genSentinelle(f); } },
    mine: { fr: 2, gen: function (v, f) { return genMine(v, f); } },
    colosse: { fr: 2, gen: function (v, f) { return genColosse(v, f); } },
    tirennemi: { fr: 2, gen: function (v, f) { return genTirEnnemi(v, f); } },
    butin: { fr: 4, gen: function (v, f) { return genButin(f); } },
    son: { fr: 1, gen: function (v) { return genIcone('son', v); } },
    muet: { fr: 1, gen: function (v) { return genIcone('muet', v); } },
    pause: { fr: 1, gen: function (v) { return genIcone('pause', v); } },
    lecture: { fr: 1, gen: function (v) { return genIcone('lecture', v); } },
    vie: { fr: 1, gen: function () { return genIcone('vie'); } },
    vievide: { fr: 1, gen: function () { return genIcone('vievide'); } },

    ko: { fr: 1, gen: function () { return genIcone('ko'); } }

  /* les noms que d'autres modules emploient déjà, et les synonymes évidents */
  var ALIASN = { seg: 'corps', segment: 'corps', cellule: 'butin', energie: 'butin', balle: 'tirennemi',

    sonactif: 'son', soncoupe: 'muet', vievide: 'vievide' };

  var LISTE = ['tete', 'tete:0..15', 'corps', 'corps:9', 'corps:7', 'corps:5', 'corps:3', 'queue', 'tir', 'tir:0..15',

     que soit la graine passée (un compteur qui croît sans fin ne le fait pas gonfler). */

  /* PRÉCHAUFFAGE. Tout construire coûte une quarantaine de millisecondes sur un ordinateur : trop pour
     une seule image, rien du tout réparti. warm(n) construit au plus n sprites encore absents et rend
     le nombre qui reste ; le module s'appelle lui-même par petites tranches (setTimeout, sans lire
     l'horloge) dès son chargement, si bien que tout est prêt pendant l'ouverture et qu'aucune
     construction ne tombe en pleine partie. Un appel explicite reste possible, il ne fait que hâter. */
  var warmList = null, warmAt = 0;
  function warm(n) {
    if (!warmList) {

        'tourelle:charge', 'sentinelle', 'mine', 'mine:alerte', 'tirEnnemi', 'tirEnnemi:petit', 'tirEnnemi:gros', 'butin',
        'son', 'muet', 'pause', 'lecture', 'vie', 'vieVide', 'ok', 'ko', 'colosse', 'colosse:oeil'], i, k, fr;
      /* d'abord ce qui est à l'écran dès la première seconde de jeu, le colosse en dernier */
      for (i = 0; i < dirs.length; i++) for (fr = 0; fr < frames(dirs[i]); fr++) for (k = 0; k < 16; k++) warmList.push([dirs[i] + ':' + k, fr]);
      for (i = 0; i < plain.length; i++) for (fr = 0; fr < frames(plain[i]); fr++) warmList.push([plain[i], fr]);

    return s;
  }

  /* ---------------------------------------------------------------------------------------------- */
  /* LA POLICE 5×7                                                                                    */
  /* ---------------------------------------------------------------------------------------------- */
  /* chasse fixe, comme une borne : chaque signe est centré dans une case de 5, l'avance est de 6. Un texte

    'D': '####./#...#/#...#/#...#/#...#/#...#/####.',
    'E': '#####/#..../#..../####./#..../#..../#####',

   par index dans le tampon de 10-gfx.js : aucune transparence, aucun dégradé interpolé, aucune couleur
   écrite ici (les seize viennent de N.pal). Une explosion se compose de :

       des bandes concentriques, chaque frontière tramée par la matrice de Bayer, chaque bord bosselé par
       un bruit à gros grain ;
     - une boule qui se TROUE par le centre : le trou grandit plus vite qu'elle et la creuse en couronne,
       des trous en blocs la mitent, des brèches déchirées la cassent en arcs qui refroidissent ;
     - un ou deux ANNEAUX de choc tramés, partis l'un après l'autre, qui s'étendent, maigrissent et se
       PERCENT par secteurs (le bruit est angulaire : une brèche reste au même angle et s'élargit) ;
     - des ÉCLATS carrés lancés en ligne droite, freinés, avec une traînée qui refroidit d'un cran ;
       posés, ils restent au sol en ardoise de 3,2 à 4,4 s (recherche G-30, couleurs sombres) ;

  function drawCore(e) {

        else if (u < 0.65) { head = BRAS; tail = SANG; }
        else { head = SANG; tail = ARD; }

/* ===== 60-intro.js ===== */
/* ===== 60-intro.js — le metteur en scène : l'ouverture, les interludes, l'invite à jouer =====

   INTERFACE (N.intro), stable :

     N.intro.reset()            l'ouverture depuis le début ; S.phase = 'intro'. 90-boot.js l'appelle au
                                démarrage ; 70-game.js n'a pas à l'appeler.
     N.intro.update(dt)         avance ce qui est en cours. 90-boot.js l'appelle tant que S.phase vaut 'intro'.
     N.intro.draw()             le dessine, plein écran, dans le tampon. Avance seule son horloge si update()
                                n'a pas été appelée dans l'image : l'oublier ne fige rien.
     N.intro.transition(nom [, {nom: 'LE CYCLOPE'}])   -> true si l'interlude part
         'boss'      ALERTE (1,2 s) puis le colosse et son nom (1,8 s) : 3 s au plus, sautable.
                     L'INTERLUDE PREND LA MAIN : S.phase passe à 'intro', donc 90-boot.js appelle N.intro et
                     plus le jeu, qui est GELÉ DE FAIT (ni update, ni draw, ni drawTop) ; à la fin, S.phase
                     reprend la valeur qu'elle avait. Le télégraphe du colosse commence au retour en jeu.
                     La dernière image du jeu est figée pour le fondu ; les explosions en cours sont vidées
                     (N.fx.reset), sinon 90-boot.js les dessinerait par-dessus le panneau.
         'victoire' / 'defaite'   le FOND de l'écran de fin, assombri d'un cran : il ne gèle rien et ne
                     retarde rien (écran de fin en moins d'1 s, J-17). Révélation de 0,4 s au premier dessin.
     N.intro.busy()             -> true PENDANT L'INTERLUDE DU COLOSSE, où le jeu est gelé (S.phase vaut aussi
                                'intro'). C'est la façon de savoir si un interlude est en cours.
     N.intro.current()          -> 'boss' | 'victoire' | 'defaite' | null : le dernier interlude demandé, encore
                                à l'écran ; le fond de fin le reste jusqu'à N.intro.stop().
     N.intro.stop()             retire l'interlude ou le fond de fin (relance d'une partie). Rend la main au jeu.
     N.intro.skip()             saute ce qui est en cours, comme un toucher.
     N.intro.state(), .log      état et journal horodaté des étapes, pour les tests ; .ETAPES, .GARDE.

   CE QUE 70-game.js FAIT (et fait déjà) :

     N.intro.transition('boss');            // l'interlude prend la main : rien d'autre à faire. Une garde
                                            // « if (N.intro.busy()) { N.intro.update(dt); return; } » dans
                                            // update() reste correcte, elle n'est simplement plus atteinte.
     N.intro.transition(victoire ? 'victoire' : 'defaite');      // fin de partie, puis à chaque image :
     if (N.intro.current()) N.intro.draw(); // dans drawTop(), AVANT le score et le défi : le fond couvre le
                                            // monde et les explosions, l'écran de fin se pose par-dessus
     N.intro.stop();                        // à la relance

   L'ENTRÉE. Un toucher ou une touche saute tout ce qui est en cours. Le signal est S.input.any, que
   90-boot.js lève à chaque touche et à chaque toucher : ce module le remet à false au début de chaque
   séquence et pendant la garde, puis le lit. Garde de 300 ms (recherche/game-design-campagne.md, G-37) :
   un toucher reçu dans les 300 premières ms d'une séquence est ignoré, pour qu'un geste destiné au jeu
   ne saute pas une scène jamais vue. Le doigt qui saute l'ouverture devient le manche : le jeu part avec.

   L'OUVERTURE (≈ 11,5 s, puis l'invite attend) : exterieur 2 s → connexion 1,5 s → eveil 2 s →
   titre 3 s (horizon, grille qui défile vers l'horizon, logo construit par vagues de pixels) →
   briefing 3 s (AN 2975 / TU ES EN LIGNE / TIENS 2 MINUTES, tapées lettre à lettre) → invite « TOUCHE
   POUR JOUER » / « ESPACE POUR JOUER ». Au premier toucher ou à la première touche, S.phase passe de 'intro' à 'play'.

   LES PANNEAUX. Fixes (N.art.get), ou l'image courante de leur clip si la vidéo joue (N.art.play / get /
   stop) : la vidéo est un bonus, tout est cadencé sur l'horloge de ce module. Jamais redessinés ni
   agrandis : posés au pixel près, recadrés au centre (point focal propre à chaque panneau), animés à la
   manière des cinématiques d'arcade — révélation par bandes, seuil de Bayer, dérive par pas entiers,
   ligne de balayage, échange d'index cyan ↔ cyan pâle. En portrait, le panneau est un bandeau posé sur
   le vide, fondu au tramage en haut et en bas, et le texte va dessous. Sans illustration décodée, un
   décor procédural (ciel tramé, soleil en bandes, grille) prend le relais.

   RÈGLES TENUES ICI : aucune couleur écrite (tout passe par N.pal.i), aucun tirage aléatoire du navigateur (le bruit est un
   hachage local déterministe : N.rnd appartient au jeu et n'est jamais consommé, comme dans 20-crt.js),

   SNAKE 2975, deux minutes qui vont du calme au chaos et se comprennent en cinq secondes.

   LA BOUCLE. La joueuse est un serpent de données cyan qui avance toujours. Elle s'oriente au manche
   flottant de 90-boot.js (S.input.x, y, mag) ou au clavier ; le virage part dès l'image suivante à
   5,9 rad/s (un quart de tour en 266 ms, J-06) et un cap demandé reste mémorisé jusqu'à être atteint :
   lever le doigt ne change rien (J-02, G-20). Le tir part seul vers l'avant (J-10) ; au clavier, Espace
   le nourrit. Chaque cellule d'énergie ambre allonge le serpent, et la longueur est la puissance : deux,
   trois puis cinq canons, et un multiplicateur de score. Jouer rapporte, ne rien faire non (J-11).

   L'ARÈNE EST L'ÉCRAN. Pas de caméra : tout ce qui compte se voit, et les explosions de 50-fx.js tombent
   aux coordonnées du tampon sans glisser. La tête reste dans la zone sûre et, en portrait, hors du quart
   bas où repose le pouce (J-09) ; contre un bord elle glisse le long du mur, elle ne meurt jamais d'un
   mur. Le corps ne blesse pas la tête et il absorbe les tirs ennemis.

   LA MONTÉE. Minute un : deux types (flèche, mine) et de la place. Minute deux : les quatre (tourelle et
   sentinelle en plus), deux fois plus d'ennemis vivants, puis le colosse annoncé par
   N.intro.transition('boss') et un télégraphe long. Le nombre d'ennemis visé et la tension croissent par
   tranches de vingt secondes (critère 6 de DIRECTION.md).

   RIEN NE NAÎT DANS LE CHAMP. Les ennemis ordinaires naissent hors du tampon, à plus de 80 px de la
   tête, et entrent ; le colosse et les renforts qu'il appelle naissent dans le champ, mais seulement
   après un télégraphe d'au moins 0,9 s pendant lequel rien ne blesse (G-14). Chaque apparition est
   journalisée (dbg().stats.spawns) pour la preuve.

    var sp0 = 32 + 14 * (t / DUREE);
    if (e.st === 'chasse') {
      var lx = P.x + Math.cos(P.ang) * V * 0.25, ly = P.y + Math.sin(P.ang) * V * 0.25;
      e.ang = turnTo(e.ang, Math.atan2(ly - e.y, lx - e.x), 2.6 * dt);
      e.x += Math.cos(e.ang) * sp0 * dt; e.y += Math.sin(e.ang) * sp0 * dt;
      e.cd -= dt;
      var dd = d2(e.x, e.y, P.x, P.y);
      if (t > 25 && e.cd <= 0 && canAct(e) && dd < 80 * 80 && dd > 26 * 26 && charges < 2) {
        charges++;
        e.st = 'vise'; e.stT = 0.6; e.aim = Math.atan2(P.y - e.y, P.x - e.x);           // télégraphe : 0,6 s
      }
    } else if (e.st === 'vise') {
      e.stT -= dt; if (e.stT <= 0) { e.st = 'fonce'; e.stT = 0.42; }
    } else if (e.st === 'fonce') {
      var ox = e.x, oy = e.y;
      e.x += Math.cos(e.aim) * 155 * dt; e.y += Math.sin(e.aim) * 155 * dt;
      if (N.fx && N.fx.trail) safe('fx.trail', function () { N.fx.trail(ox, oy, e.x, e.y, ROSE); });
      e.stT -= dt; if (e.stT <= 0) { e.st = 'chasse'; e.cd = rr(3.5, 6); e.ang = e.aim; }
    }
  }
  function updMine(e, dt) {
    e.spin += dt * (e.st === 'arme' ? 9 : 1.6);
    if (e.st === 'derive') {
      var dx = e.tx - e.x, dy = e.ty - e.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 2) { e.st = 'pose'; e.life = 15; } else { e.x += dx / d * 16 * dt; e.y += dy / d * 16 * dt; }
    } else if (e.st === 'pose') {
      e.life -= dt;
      if (e.life <= 0 && canAct(e)) { e.st = 'arme'; e.stT = 0.75; }
    } else if (e.st === 'arme') {
      e.stT -= dt;
      if (e.stT <= 0) {
        boom(e.x, e.y, 0.5, MAGENTA); sfx('kill', { pitch: 0 });
        if (st === 'jeu' && d2(e.x, e.y, P.x, P.y) < (26 + R_TETE) * (26 + R_TETE)) hurt(e.x, e.y, 'mine');
        e.dead = true; return;
      }
    }
    if (e.st !== 'arme' && canAct(e) && d2(e.x, e.y, P.x, P.y) < 34 * 34) { e.st = 'arme'; e.stT = 0.75; }   // télégraphe : 0,75 s
  }
  function updTourelle(e, dt) {
    var want = Math.atan2(P.y - e.y, P.x - e.x);
    if (e.st === 'entre') {
      var dx = e.tx - e.x, dy = e.ty - e.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 2) { e.st = 'pose'; e.cd = 0.9; } else { e.x += dx / d * 30 * dt; e.y += dy / d * 30 * dt; }
      e.aim = turnTo(e.aim, want, 3 * dt);
    } else if (e.st === 'pose') {
      e.aim = turnTo(e.aim, want, 3 * dt);
      e.cd -= dt;
      if (e.cd <= 0 && canAct(e)) { e.st = 'vise'; e.stT = 0.65; e.aim = want; }              // télégraphe : 0,65 s
    } else if (e.st === 'vise') {
      e.stT -= dt;
      if (e.stT <= 0) {
        ebullet(e.x + Math.cos(e.aim) * 7, e.y + Math.sin(e.aim) * 7, e.aim, 74, false);
        e.shots++;
        if (e.shots >= 3) { e.shots = 0; e.st = 'entre'; station(e, 24); }
        else { e.st = 'pose'; e.cd = rr(2.2, 3.2) - 0.6 * clamp((t - 60) / 60, 0, 1); }
      }
    }
  }
  function updSentinelle(e, dt) {
    if (e.st === 'orbite') {
      e.orb += 0.45 * dt * e.dir;
      var tx = clamp(P.x + Math.cos(e.orb) * 78, 10, W - 10), ty = clamp(P.y + Math.sin(e.orb) * 78, AT - 6, H - 10);
      var dx = tx - e.x, dy = ty - e.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 1) { e.x += dx / d * Math.min(d, 36 * dt); e.y += dy / d * Math.min(d, 36 * dt); }
      e.ang = Math.atan2(P.y - e.y, P.x - e.x);
      e.cd -= dt;
      if (e.cd <= 0 && canAct(e)) { e.st = 'vise'; e.stT = 0.85; e.aim = Math.atan2(P.y - e.y, P.x - e.x); }   // télégraphe : 0,85 s
    } else if (e.st === 'vise') {
      e.stT -= dt; if (e.stT <= 0) { e.st = 'tire'; e.stT = 0.35; beam(e.x, e.y, e.aim, 0.35, 3, 'sentinelle'); }
    } else if (e.st === 'tire') {
      e.stT -= dt; if (e.stT <= 0) { e.st = 'orbite'; e.cd = rr(4.5, 6.5) - 1.2 * clamp((t - 60) / 60, 0, 1); }
    }
  }

  var charges = 0;                              // flèches en télégraphe ou en charge, au plus deux
  function updEnemies(dt) {
    var i, e;
    charges = 0;
    for (i = 0; i < E.length; i++) if (!E[i].dead && E[i].k === 'fleche' && (E[i].st === 'vise' || E[i].st === 'fonce')) charges++;
    for (i = 0; i < E.length; i++) {
      e = E[i];
      if (e.dead) continue;
      if (e.flash > 0) e.flash -= dt;
      if (e.k === 'colosse') { updBoss(e, dt); continue; }
      e.age += dt;
      if (e.stun > 0) e.stun -= dt;
      if (e.kx || e.ky) { e.x += e.kx * dt; e.y += e.ky * dt; var f = Math.pow(0.02, dt); e.kx *= f; e.ky *= f; if (Math.abs(e.kx) + Math.abs(e.ky) < 2) { e.kx = 0; e.ky = 0; } }
      if (e.k === 'fleche') updFleche(e, dt);
      else if (e.k === 'mine') updMine(e, dt);
      else if (e.k === 'tourelle') updTourelle(e, dt);
      else updSentinelle(e, dt);
      if (e.dead) continue;
      /* trop loin hors du tampon : on le rappelle (une flèche qui a dépassé sa cible) */
      if (e.x < -60 || e.x > W + 60 || e.y < -60 || e.y > H + 60) { e.x = clamp(e.x, -40, W + 40); e.y = clamp(e.y, -40, H + 40); if (e.k === 'fleche') e.st = 'chasse'; }
      if (st === 'jeu' && P.invul <= 0) {
        var rr2 = R_TETE + e.r * 0.72;
        if (d2(e.x, e.y, P.x, P.y) < rr2 * rr2) { hurt(e.x, e.y, e.k + (e.st === 'fonce' ? ' (charge)' : '')); var d = Math.sqrt(d2(e.x, e.y, P.x, P.y)) || 1; e.kx = (e.x - P.x) / d * 120; e.ky = (e.y - P.y) / d * 120; }
      }
    }
    /* les flèches ne s'empilent pas */
    for (i = 0; i < E.length; i++) {
      var a = E[i]; if (a.k !== 'fleche' || a.dead) continue;
      for (var j = i + 1; j < E.length; j++) {
        var b = E[j]; if (b.k !== 'fleche' || b.dead) continue;
        var dd = d2(a.x, a.y, b.x, b.y);
        if (dd < 81 && dd > 0.01) { var dn = Math.sqrt(dd), push = (9 - dn) * 0.5 / dn, px = (a.x - b.x) * push, py = (a.y - b.y) * push; a.x += px; a.y += py; b.x -= px; b.y -= py; }
      }
    }
  }

  function kill(e) {
    if (e.dead) return;
    e.dead = true;
    var T = TYPES[e.k];
    kills++; stats.kills++; stats.killsBy[e.k]++;
    if (t - lastKill <= CHAINE) chain++; else chain = 1;
    lastKill = t;
    var pts = T.pts * mult();
    score += pts;
    pop(e.x, e.y - 8, '+' + pts, JAUNE);
    if (DEFI.etat === 'actif') { DEFI.prog = chain; if (chain > DEFI.meilleur) DEFI.meilleur = chain; if (chain >= DEFI.but) defiOk(); }
    var sl = stats.slices[Math.min(5, Math.floor(t / 20))]; if (sl) sl.kills++;
    if (e.k === 'colosse') { bossDie(e); return; }
    var big = e.k === 'tourelle' || e.k === 'sentinelle';
    boom(e.x, e.y, big ? 0.45 : 0.32, MAGENTA);
    sfx('kill', { pitch: Math.min(14, chain - 1) });
    if (hsCd <= 0) { hitstop(T.hs); hsCd = 0.12; }
    for (var k = 0; k < T.butin; k++) addCell(e.x, e.y, rr(-50, 50), rr(-50, 50), false, 0);
  }

  /* ============================ projectiles ============================ */
  function updShots(dt) {
    var i, j, b, e, k;
    for (i = PB.length - 1; i >= 0; i--) {
      b = PB[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -4 || b.x > W + 4 || b.y < -4 || b.y > H + 4) { PB.splice(i, 1); continue; }
      for (j = 0; j < E.length; j++) {
        e = E[j];
        if (e.dead || e.st === 'naissance') continue;
        var rr2 = e.r + 1.5;
        if (d2(b.x, b.y, e.x, e.y) < rr2 * rr2) {
          e.pv -= b.dmg; flash(e);
          if (N.fx && N.fx.spark) safe('fx.spark', function () { N.fx.spark(b.x, b.y, -b.vx, -b.vy, 2, e.k === 'colosse' ? OS : ROSE); });
          if (e.pv <= 0) kill(e);
          PB.splice(i, 1);
          break;
        }
      }
    }
    for (i = 0; i < EB.length; i++) {
      b = EB[i];
      if (b.dead) continue;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -8 || b.x > W + 8 || b.y < -8 || b.y > H + 8) { b.dead = true; continue; }
      if (st === 'jeu' && P.invul <= 0 && d2(b.x, b.y, P.x, P.y) < (R_TETE + b.r) * (R_TETE + b.r)) { b.dead = true; hurt(b.x, b.y, b.big ? 'tir du colosse' : 'tir de tourelle'); continue; }
      /* le corps absorbe les tirs ennemis (la tête a sa propre zone) */
      for (k = 2; k <= P.len; k++) {
        segAt(k);
        var rk = segR(k) + b.r;
        if (d2(b.x, b.y, SPX, SPY) < rk * rk) { spark(b.x, b.y, CYANP, 3); b.dead = true; break; }
      }
    }
    for (i = 0; i < BEAMS.length; i++) {
      b = BEAMS[i];
      if (b.dead) continue;
      b.t += dt;
      if (b.t >= b.d) { b.dead = true; continue; }
      var hw = b.w / 2 + R_TETE;
      if (st === 'jeu' && P.invul <= 0 && segDist2(P.x, P.y, b.x0, b.y0, b.x1, b.y1) < hw * hw) hurt(b.x0, b.y0, 'laser ' + b.src);
    }
    compact(EB); compact(BEAMS);
  }
  function compact(L) { var j = 0; for (var i = 0; i < L.length; i++) if (!L[i].dead) L[j++] = L[i]; L.length = j; }

  /* ============================ énergie, éclats, textes ============================ */
  function updCells(dt) {
    for (var i = CELLS.length - 1; i >= 0; i--) {
      var c = CELLS[i];
      c.t += dt;
      if (c.tele > 0) { c.tele -= dt; continue; }
      c.life -= dt;
      if (c.life <= 0) { CELLS.splice(i, 1); continue; }
      var f = Math.pow(0.05, dt); c.vx *= f; c.vy *= f;
      if (st === 'jeu' || st === 'purge') {
        var dd = d2(c.x, c.y, P.x, P.y);
        if (dd < R_AIMANT * R_AIMANT) {
          var d = Math.sqrt(dd) || 1, pull = 160 * (1 - d / R_AIMANT) + 40;
          c.vx += (P.x - c.x) / d * pull * dt * 6; c.vy += (P.y - c.y) / d * pull * dt * 6;
        }
        if (dd < R_PRISE * R_PRISE) {
          CELLS.splice(i, 1);
          if (P.len < LENMAX) P.len++;
          score += 10 * mult();
          sfx('butin', { pitch: P.len });
          spark(c.x, c.y, JAUNE, 3);
          continue;
        }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.x = clamp(c.x, AL - 4, AR + 4); c.y = clamp(c.y, AT - 4, AB + 4);
    }
  }
  function debris(x, y, c, n) {
    for (var i = 0; i < n && DEB.length < 300; i++) {
      var a = rr(0, TAU), v = rr(10, 60);
      DEB.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: c, t: 0, life: rr(0.35, 0.7) });
    }
  }
  function spark(x, y, c, n) {
    for (var i = 0; i < n && DEB.length < 300; i++) {
      var a = rr(0, TAU), v = rr(20, 70);
      DEB.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: c, t: 0, life: rr(0.12, 0.3) });
    }
  }
  function pop(x, y, s, c) { if (POP.length > 24) POP.shift(); POP.push({ x: x, y: y, s: s, c: c, t: 0 }); }

  function updCommon(dt) {
    var i;
    ak += dt;
    for (i = DEB.length - 1; i >= 0; i--) {
      var d = DEB[i]; d.t += dt;
      if (d.t >= d.life) { DEB.splice(i, 1); continue; }
      var f = Math.pow(0.004, dt); d.vx *= f; d.vy *= f; d.x += d.vx * dt; d.y += d.vy * dt;
    }
    for (i = POP.length - 1; i >= 0; i--) { POP[i].t += dt; POP[i].y -= dt * 14; if (POP[i].t > 0.8) POP.splice(i, 1); }
    for (i = FXL.length - 1; i >= 0; i--) { FXL[i].t += dt; if (FXL[i].t >= FXL[i].d) FXL.splice(i, 1); }
    for (i = TIMERS.length - 1; i >= 0; i--) { TIMERS[i].left -= dt; if (TIMERS[i].left <= 0) { var fn = TIMERS[i].fn; TIMERS.splice(i, 1); fn(); } }
    if (banner) { banner.t += dt; if (banner.t >= banner.d) banner = null; }
    if (dmgT > 0) dmgT -= dt;
    if (hsCd > 0) hsCd -= dt;
    if (muteFlash > 0) muteFlash -= dt;
  }

  /* ============================ statistiques de la preuve ============================ */
  function sample() {
    var k = Math.min(5, Math.floor(t / 20)), sl = stats.slices[k];
    if (!sl) return;
    var c = 0; for (var i = 0; i < E.length; i++) if (!E[i].dead) c++;
    sl.alive += c; sl.tension += tension(); sl.n++;
    if (c > stats.maxAlive) stats.maxAlive = c;
  }

  /* ============================ la boucle ============================ */
  function update(dt) {
    if (!S) S = N.S;
    if (!S) return;
    if (!P) { reset(S.seed); if (!P) return; }
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    sizeUp();
    taps();
    /* un interlude en cours : le monde est gelé, c'est lui qui avance (protocole de 60-intro.js) */
    if (busy()) { safe('intro.update', function () { N.intro.update(dt); }); return; }
    if (st === 'jeu') {
      t += dt;
      if (typeof window !== 'undefined' && typeof window.__PILOT === 'function') { try { window.__PILOT(dbg()); } catch (x) { /* pilote de test */ } }
      updPlayer(dt);
      updFire(dt);
      director(dt);
      if (bossPhase === 'tele' && !busy()) { bossT -= dt; if (bossT <= 0) bossArrive(); }
      updEnemies(dt);
      updShots(dt);
      updCells(dt);
      if (chain > 0 && t - lastKill > CHAINE) { chain = 0; if (DEFI.etat === 'actif') DEFI.prog = 0; }
      sample();
      if (t >= DUREE && st === 'jeu') startPurge();
    } else if (st === 'mort') {
      stT += dt;
      /* le serpent se dissout de la tête à la queue ; le monde reste figé */
      var n = Math.floor(stT / MORT_D * (P.len + 2));
      while (P.gone < n && P.gone <= P.len) {
        segAt(P.gone); debris(SPX, SPY, P.gone % 3 ? CYAN : CYANP, 3);
        if (P.gone % 7 === 3) boom(SPX, SPY, 0.2, CYAN);
        P.gone++;
      }
      if (stT >= MORT_D) endGame(false);
    } else if (st === 'purge') {
      stT += dt;
      updPlayer(dt);
      updCells(dt);
      while (purgeList && purgeI < purgeList.length && stT >= purgeNext) {
        var e = purgeList[purgeI++];
        if (!e.dead) {
          e.dead = true;
          if (e.k === 'colosse') { boom(e.x, e.y, 1, MAGENTA); hitstop(20); sfx('bigkill'); stats.bossDeathT = t; }
          else boom(e.x, e.y, 0.36, MAGENTA);
        }
        purgeNext += 0.045;
      }
      if (purgeList && purgeI >= purgeList.length && stT >= purgeNext + 0.6) endGame(true);
    } else if (st === 'fin') {
      finT += dt;
      /* repli sans 60-intro.js : le clip de fin joue sous le panneau */
      if (!current() && !finClip && N.art && N.art.play) { finClip = finV ? 'victoire' : 'defaite'; safe('art.play', function () { N.art.play(finClip); }); }
    }
    updCommon(dt);
    for (var q = E.length - 1; q >= 0; q--) if (E[q].dead) E.splice(q, 1);
    publish();
  }

  function startPurge() {
    st = 'purge'; stT = 0;
    if (DEFI.etat === 'actif') defiRate();
    purgeList = E.slice().sort(function (a, b) { return d2(a.x, a.y, P.x, P.y) - d2(b.x, b.y, P.x, P.y); });
    purgeI = 0; purgeNext = 0.25;
    for (var i = 0; i < EB.length; i++) spark(EB[i].x, EB[i].y, ROSE, 1);
    EB.length = 0; BEAMS.length = 0;
    P.invul = 9;
  }

  function endGame(v) {
    st = 'fin'; finV = v; finT = 0; stT = 0;
    if (score > record) { newRecord = record > 0; record = score; store(K_REC, '' + record); }   // annoncé seulement s'il y avait un record à battre
    stats.endT = t; stats.victoire = v;
    QT.length = 0;
    firstGame = false;
    transition(v ? 'victoire' : 'defaite');
  }

  function restart() {
    if (N.intro && N.intro.stop) safe('intro.stop', function () { N.intro.stop(); });
    if (finClip && N.art && N.art.stop) { var f = finClip; safe('art.stop', function () { N.art.stop(f); }); }
    finClip = null;
    reset(seed + 1);
  }

  /* ============================ touchers : bouton son et relance ============================
     90-boot.js n'expose pas la position d'un clic de souris ; on écoute donc pointerdown (souris ET doigt,
     émis avant touchstart même quand celui-ci est annulé) et keydown, passivement, sans rien empêcher. Le
     traitement attend update(), après le geste de 90-boot.js (qui, lui, lance le son au premier toucher).
     Un geste reçu pendant l'ouverture ou un interlude n'est pas pour nous : il saute la scène. */
  var listening = false;
  function listen() {
    if (listening || typeof window === 'undefined' || !window.addEventListener) return;
    listening = true;
    window.addEventListener('pointerdown', function (ev) {
      var s = N.S; if (!s || s.phase === 'intro' || busy()) return;
      var c = G.canvas ? G.canvas() : null, r = c && c.getBoundingClientRect ? c.getBoundingClientRect() : { left: 0, top: 0 }, p = G.PX || 1;
      QT.push({ x: (ev.clientX - r.left) / p, y: (ev.clientY - r.top) / p, key: null });
      if (QT.length > 8) QT.shift();
    }, { passive: true });
    window.addEventListener('keydown', function (ev) {
      var s = N.S; if (!s || s.phase === 'intro' || busy() || ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      QT.push({ x: -1, y: -1, key: ev.code });
      if (QT.length > 8) QT.shift();
    }, { passive: true });
  }
  function onSB(x, y) { return x >= SB.x && x < SB.x + SB.w && y >= SB.y && y < SB.y + SB.h; }
  function taps() {
    while (QT.length) {
      var q = QT.shift();
      if (q.key === 'KeyM' || (q.key === null && onSB(q.x, q.y))) { toggleMute(); continue; }
      if (st === 'fin' && !busy() && finT >= GARDE && q.key !== 'Tab' && q.key !== 'Escape') { restart(); QT.length = 0; return; }
    }
  }
  function toggleMute() {
    muted = !muted;
    store(K_SON, muted ? '0' : '1');
    if (N.music && N.music.mute) applyMute();
    else if (N.music) {                              // repli sans N.music.mute : la partition s'arrête, nos sons sont filtrés
      if (muted) { if (N.music.stop) safe('music.stop', function () { N.music.stop(); }); }
      else if (N.music.start && N.music.info && N.music.info()) safe('music.start', function () { N.music.start(); });
    }
    muteFlash = 0.35;
    if (S) S.muted = muted;
  }
  /* N.music.mute(v) (30-music.js) coupe tout, sons de 60-intro.js compris, et vaut avant même la création
     du contexte audio ; sans lui, on retombe sur stop() tenu à chaque instant. */
  function applyMute() {
    if (!N.music) return;
    if (N.music.mute) {
      if (!N.music.muted || N.music.muted() !== muted) safe('music.mute', function () { N.music.mute(muted); });
      return;
    }
    if (muted && N.music.stop) safe('music.stop', function () { N.music.stop(); });
  }
  muted = load(K_SON) === '0';

  /* ============================ tension : pilote la musique ============================
     Croissante par tranches de vingt secondes : 0,06 puis +0,175 par tranche, et un léger glissement

/* ===== 90-boot.js ===== */
/* Amorçage : horloge, redimensionnement, entrées, boucle d'images, quarantaine des erreurs.

   protégée, pour qu'un module en cours d'écriture puisse être vu à l'écran sans attendre les autres. */

var N = (typeof window !== 'undefined' && window.__N) || {};

/* ---- état partagé ---- */
var S = {
  t: 0, dt: 0, frame: 0, phase: 'intro', seed: 2084, rngState: 2084,
  shake: 0, heat: 0, score: 0, lives: 3, tension: 0,
  enemies: [], player: null, challenge: null, paused: false,
  view: { w: 0, h: 0, safe: { l: 0, t: 0, r: 0, b: 0 } }, input: { x: 0, y: 0, mag: 0, fire: false, any: false },

/* générateur à graine : aucun Math.random dans tout le prototype */
function rnd() { S.rngState = (S.rngState * 1664525 + 1013904223) % 4294967296; return S.rngState / 4294967296; }

/* ---- quarantaine : une erreur est comptée une fois par signature, la boucle survit ---- */

function errLog(where, e) {

/* ---- palette de secours : remplacée par 00-pal.js dès qu'il existe ---- */
var FALLBACK = ['#0d0221', '#190b28', '#241734', '#541388', '#2d1b69', '#ff2a6d', '#ff8fab', '#05d9e8',
  '#d1f7ff', '#ff9e00', '#ffd319', '#ff5714', '#fffce8', '#8a8fa3', '#8b0f3a', '#01012b'];
function palTable() { return (N.pal && N.pal.C) || FALLBACK; }

/* ---- sortie ---- */
var out = null, octx = null;

function resize() {
  if (!out) return;
  var cssW = Math.max(1, window.innerWidth | 0), cssH = Math.max(1, window.innerHeight | 0);
  var dpr = 1;                                  // un pixel de jeu est un carré net : jamais de DPR ici
  out.style.width = cssW + 'px'; out.style.height = cssH + 'px';
  if (N.gfx && N.gfx.resize) {
    /* la zone sûre (encoche, barre d'accueil) est passée à gfx.resize, qui en tire la taille du pixel */
    var sa = safeArea();
    var r = N.gfx.resize(cssW, cssH, Math.max(1, cssW - sa.l - sa.r), Math.max(1, cssH - sa.t - sa.b));
    /* le canvas fait EXACTEMENT tampon x px en CSS, centré, quitte à déborder de moins d'un pixel de
       jeu : sinon le navigateur le réduit d'un facteur non entier et ampute une rangée de pixels */
    var ow = r.w * r.px, oh = r.h * r.px;
    out.style.width = ow + 'px'; out.style.height = oh + 'px';
    out.style.left = Math.floor((cssW - ow) / 2) + 'px'; out.style.top = Math.floor((cssH - oh) / 2) + 'px';
    out.width = Math.round(ow * dpr); out.height = Math.round(oh * dpr);
    S.view.w = r.w; S.view.h = r.h;
    S.view.safe = { l: Math.ceil(sa.l / r.px), t: Math.ceil(sa.t / r.px), r: Math.ceil(sa.r / r.px), b: Math.ceil(sa.b / r.px) };
  } else {
    out.width = cssW; out.height = cssH; S.view.w = cssW; S.view.h = cssH;
  }

/* marges sûres de l'écran (encoche, barre d'accueil), lues sur une sonde CSS env(safe-area-inset-*) */
var sonde = null;
function safeArea() {
  if (!sonde) {
    sonde = document.createElement('div');
    sonde.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;'
      + 'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(sonde);

  return { l: parseFloat(cs.paddingLeft) || 0, t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0 };

/* ---- motif de contrôle : visible tant qu'aucun module ne dessine ---- */
function mire() {
  if (!octx) return;
  var C = palTable(), w = out.width, h = out.height, n = C.length, bw = Math.max(1, (w / n) | 0);
  for (var i = 0; i < n; i++) { octx.fillStyle = C[i]; octx.fillRect(i * bw, 0, bw, h); }
  octx.fillStyle = C[12];
  octx.font = '16px ui-monospace,monospace';
  octx.fillText('SNAKE 2975 — en construction', 12, 24);
  octx.fillText('modules : ' + Object.keys(N).filter(function (k) { return k !== 'S'; }).join(' '), 12, 44);
}

/* ---- entrées : un seul point d'entrée, clavier et doigt ---- */
var keys = {};
function onKey(e, down) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.repeat) return;
  keys[e.code] = down;
  if (down) S.input.any = true;
  var l = keys.ArrowLeft || keys.KeyA || keys.KeyQ, r = keys.ArrowRight || keys.KeyD;
  var u = keys.ArrowUp || keys.KeyW || keys.KeyZ, d = keys.ArrowDown || keys.KeyS;

/* Au doigt : manche virtuel flottant, le standard des jeux d'action sur téléphone (recherche/

   au repos. La direction est le vecteur depuis ce point d'origine ; l'origine suit le pouce quand il
   dépasse le rayon, pour qu'un demi-tour soit immédiat. Le doigt est suivi par son identifiant : un
   second doigt qui se pose ou se lève ne vole jamais la direction. */

var stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
S.input.stick = { active: false, ox: 0, oy: 0, x: 0, y: 0, r: STICK_R };   // pixels CSS, pour l'indicateur
function stickUpdate() {
  var st = S.input.stick;
  st.active = stick.id !== null; st.ox = stick.ox; st.oy = stick.oy; st.x = stick.x; st.y = stick.y;
  if (!st.active) { S.input.mag = 0; return; }
  var dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy), a = Math.min(1, m / STICK_R);
  if (a < STICK_MORT) { S.input.mag = 0; return; }        // la dernière direction est gardée

    var dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy);

/* l'indicateur : un anneau tramé à l'origine et un point sous le pouce, en couleurs d'interface */
function drawStick() {
  var st = S.input.stick, p = N.gfx.PX || 1, r = out.getBoundingClientRect();
  var ox = Math.round((st.ox - r.left) / p), oy = Math.round((st.oy - r.top) / p);
  N.gfx.ring(ox, oy, Math.max(4, Math.round(STICK_R / p)), N.pal.i('acier'), 0.5);
  N.gfx.circ(Math.round((st.x - r.left) / p), Math.round((st.y - r.top) / p), 2, N.pal.i('os'));

/* chaque geste débloque les vidéos préparées depuis le précédent ; le premier lance aussi le son */
var audioStarted = false;
function gesture() {
  step('art.unlock', N.art && N.art.unlock ? function () { N.art.unlock(); } : null);
  S.paused = false;                                      // un retour d'arrière-plan reprend au premier geste
  /* un touchstart ne vaut pas geste pour l'iPhone : le contexte audio créé là peut rester suspendu,
     le touchend suivant le relance */
  if (audioStarted) { step('music.resume', N.music && N.music.resume ? function () { N.music.resume(); } : null); return; }
  audioStarted = true;
  /* sur iPhone, un AudioContext est « ambient » par défaut : l'interrupteur silencieux le coupe, et la
     joueuse croirait la musique cassée. « playback » le fait jouer comme une vidéo ; le jeu offre sa
     propre coupure du son. */
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

/* ---- boucle ---- */
var last = 0, DTMAX = 1 / 20;
function frame(now) {

  last = now;
  if (typeof window !== 'undefined' && window.__DT) dt = window.__DT;

  if (dt < 0) dt = 0;

  var frozen = N.fx && N.fx.hitstopLeft ? N.fx.hitstopLeft() > 0 : false;
  S.dt = frozen ? dt * 0.08 : dt;
  S.t += S.dt * 1000;
  S.frame++;
  if (typeof window !== 'undefined') window.__FRAME = S.frame;

  if (!S.paused) {
    if (S.phase === 'intro') step('intro.update', N.intro && N.intro.update ? function () { N.intro.update(S.dt); } : null);
    else step('game.update', N.game && N.game.update ? function () { N.game.update(S.dt); } : null);
    step('fx.update', N.fx && N.fx.update ? function () { N.fx.update(S.dt); } : null);
  }

  if (N.game && N.game.tension) step('tension', function () {
    S.tension = N.game.tension();
    if (N.music && N.music.tension) N.music.tension(S.tension);

  /* dessin : tampon basse résolution, puis agrandissement, puis post-traitement */
  var drew = false;
  if (N.gfx && N.gfx.clear) {
    step('gfx.clear', function () { N.gfx.clear(0); });
    if (S.phase === 'intro') step('intro.draw', N.intro && N.intro.draw ? function () { N.intro.draw(); drew = true; } : null);
    else step('game.draw', N.game && N.game.draw ? function () { N.game.draw(); drew = true; } : null);
    step('fx.draw', N.fx && N.fx.draw ? function () { N.fx.draw(); } : null);
    /* couche du dessus : ce qui doit rester lisible par-dessus les explosions (menaces, joueuse, interface) */
    if (S.phase !== 'intro') step('game.drawTop', N.game && N.game.drawTop ? function () { N.game.drawTop(); } : null);
    if (S.input.stick.active) step('stick.draw', N.gfx.ring && N.pal && N.pal.i ? drawStick : null);

  window.addEventListener('orientationchange', resize);

  window.addEventListener('keyup', function (e) { onKey(e, false); });

  app.addEventListener('touchmove', onTouchMove, { passive: false });

  app.addEventListener('touchcancel', onTouchEnd, { passive: false });
  /* en arrière-plan : le jeu se met en pause, le son s'endort ; au retour, le son reprend et le jeu
     attend le premier geste (70-game.js affiche PAUSE tant que S.paused est vrai) */

    if (document.hidden) {

    } else step('music.resume', N.music && N.music.resume ? function () { N.music.resume(); } : null);

  step('intro.reset', N.intro && N.intro.reset ? function () { N.intro.reset(); } : null);
