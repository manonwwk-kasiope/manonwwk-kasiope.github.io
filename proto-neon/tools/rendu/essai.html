<script>"use strict";
(function(){/* ===== prologue du banc (hors src/) ===== */
var N = (typeof window !== 'undefined') ? (window.__N || (window.__N = {})) : {};
/* ===== 00-pal.js ===== */
/* ===== 00-pal.js — la palette fermée, le tramage de Bayer, les conversions =====

   C'EST LE SEUL FICHIER DU PROTOTYPE OÙ UNE COULEUR EST ÉCRITE.
   Si tu as besoin d'une teinte, elle existe déjà ici sous un nom. Si elle n'existe pas, elle n'est
   pas dans la direction artistique : prends la plus proche, ou trame entre deux (N.pal.dither).

   Interface imposée par CONTRAT.md :
     N.pal.C            tableau de 16 chaînes '#rrggbb', index 0..15, ordre exact de DIRECTION.md
     N.pal.i(nom)       index par nom
     N.pal.dither(x,y,t)  -> true si le pixel (x,y) doit être posé pour une intensité t de 0 à 1

   Extras publiés en plus, pour que personne d'autre n'ait à écrire une couleur :
     N.pal.NAMES        les seize noms, dans l'ordre
     N.pal.R/G/B        Uint8Array(16) des composantes
     N.pal.U32          Uint32Array(16) prêt pour un ImageData (boutisme détecté)
     N.pal.LUM          Float32Array(16) luminance relative 0..1
     N.pal.css(ci)      '#rrggbb'
     N.pal.rgba(ci,a)   'rgba(r,g,b,a)'  — pour les voiles du post-traitement
     N.pal.near(r,g,b)  index de palette le plus proche (métrique pondérée)
     N.pal.shade(ci,k)  index le plus proche de la couleur ci multipliée par k (0..1) — ombrage SANS
                        sortir de la palette ; c'est la bonne façon d'assombrir quelque chose
     N.pal.mix(a,b,t)   index le plus proche du mélange de deux index
     N.pal.BAYER        la matrice 4x4 brute (valeurs 0..15)
     N.pal.CHAN         masques de canal pur, uniquement pour l'aberration chromatique de 20-crt.js
     N.pal.WHITE/BLACK  neutres de composition, uniquement pour les voiles de 20-crt.js
*/
(function () {
  'use strict';
  var N = (typeof window !== 'undefined') ? (window.__N || (window.__N = {}))
    : (typeof globalThis !== 'undefined' ? (globalThis.__N || (globalThis.__N = {})) : {});

  /* ---- la table, dans l'ordre exact de DIRECTION.md ---- */
  var NAMES = [
    'vide',     /*  0  fond du monde                  */
    'nuit',     /*  1  voiles, profondeur             */
    'ardoise',  /*  2  structures mortes              */
    'violet',   /*  3  treillis, grille de sol        */
    'indigo',   /*  4  treillis proche                */
    'magenta',  /*  5  ENNEMIS, danger, télégraphes   */
    'rosePale', /*  6  éclats d'ennemi                */
    'cyan',     /*  7  LA JOUEUSE, et elle seule      */
    'cyanPale', /*  8  tête, reflets de la joueuse    */
    'ambre',    /*  9  butin, énergie                 */
    'jaune',    /* 10  score, récompense              */
    'brasier',  /* 11  explosions, cœur chaud         */
    'os',       /* 12  flash de frappe, texte         */
    'acier',    /* 13  interface neutre               */
    'sang',     /* 14  ombre des ennemis              */
    'nuitProfonde' /* 15 bordure d'arène, gaine des télégraphes */
  ];
  var C = [
    '#0d0221', '#190b28', '#241734', '#541388',
    '#2d1b69', '#ff2a6d', '#ff8fab', '#05d9e8',
    '#d1f7ff', '#ff9e00', '#ffd319', '#ff5714',
    '#fffce8', '#8a8fa3', '#8b0f3a', '#01012b'
  ];
  var NC = 16;

  /* ---- décomposition ---- */
  var R = new Uint8Array(NC), G = new Uint8Array(NC), B = new Uint8Array(NC);
  var LUM = new Float32Array(NC);
  for (var k = 0; k < NC; k++) {
    var v = parseInt(C[k].slice(1), 16);
    R[k] = (v >> 16) & 255; G[k] = (v >> 8) & 255; B[k] = v & 255;
    LUM[k] = (0.299 * R[k] + 0.587 * G[k] + 0.114 * B[k]) / 255;
  }

  var IDX = {};
  for (var n = 0; n < NC; n++) IDX[NAMES[n]] = n;
  function i(nom) {
    if (typeof nom === 'number') return nom | 0;
    var r = IDX[nom];
    return r === undefined ? 0 : r;
  }

  /* ---- mots de 32 bits prêts pour un ImageData : boutisme détecté une fois ---- */
  var LE = true;
  try {
    var probe = new ArrayBuffer(4);
    new Uint32Array(probe)[0] = 1;
    LE = new Uint8Array(probe)[0] === 1;
  } catch (e) { LE = true; }
  var U32 = new Uint32Array(NC);
  for (var u = 0; u < NC; u++) {
    U32[u] = LE
      ? (((255 << 24) | (B[u] << 16) | (G[u] << 8) | R[u]) >>> 0)
      : (((R[u] << 24) | (G[u] << 16) | (B[u] << 8) | 255) >>> 0);
  }

  /* ---- tramage ordonné de Bayer 4x4 : c'est lui qui donne l'époque ----
     Un dégradé se fait au tramage, jamais en interpolation. dither(x,y,t) est monotone :
     t <= 0 ne pose rien, t >= 1 pose tout, et un t qui monte n'éteint jamais un pixel déjà posé. */
  var BAYER = new Uint8Array([
    0, 8, 2, 10,
    12, 4, 14, 6,
    3, 11, 1, 9,
    15, 7, 13, 5
  ]);
  function dither(x, y, t) {
    if (t >= 1) return true;
    if (!(t > 0)) return false;                      /* couvre 0, NaN et le négatif */
    return t * 16 > BAYER[(((y & 3) << 2) | (x & 3))];
  }

  /* ---- proximité : rester dans la palette même quand on calcule une couleur ---- */
  function near(r, g, b) {
    var best = 0, bd = Infinity;
    for (var p = 0; p < NC; p++) {
      var dr = r - R[p], dg = g - G[p], db = b - B[p];
      /* pondération perceptuelle : l'œil pèse le vert, pas le bleu */
      var d = 0.30 * dr * dr + 0.59 * dg * dg + 0.11 * db * db;
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  /* table d'ombrage précalculée : 17 niveaux de k, de 0 à 1 par seizièmes */
  var SL = 17;
  var SHADE = new Uint8Array(NC * SL);
  for (var si = 0; si < NC; si++) {
    for (var sj = 0; sj < SL; sj++) {
      var kk = sj / (SL - 1);
      SHADE[si * SL + sj] = near(R[si] * kk, G[si] * kk, B[si] * kk);
    }
  }
  function shade(ci, kq) {
    ci = i(ci) & 15;
    if (!(kq > 0)) return SHADE[ci * SL];
    if (kq >= 1) return ci;
    return SHADE[ci * SL + Math.round(kq * (SL - 1))];
  }

  function mix(a, b, t) {
    a = i(a) & 15; b = i(b) & 15;
    if (!(t > 0)) return a;
    if (t >= 1) return b;
    return near(R[a] + (R[b] - R[a]) * t, G[a] + (G[b] - G[a]) * t, B[a] + (B[b] - B[a]) * t);
  }

  function css(ci) { return C[i(ci) & 15]; }
  function rgba(ci, a) {
    var c = i(ci) & 15;
    return 'rgba(' + R[c] + ',' + G[c] + ',' + B[c] + ',' + a + ')';
  }

  N.pal = {
    C: C, NAMES: NAMES, N: NC,
    i: i, dither: dither,
    R: R, G: G, B: B, LUM: LUM, U32: U32, LE: LE,
    BAYER: BAYER,
    css: css, rgba: rgba, near: near, shade: shade, mix: mix, SHADE: SHADE, SL: SL,

    /* Neutres et masques de canal. Ils ne servent QU'À la composition de 20-crt.js (voiles,
       multiplications, séparation des canaux) et ne doivent jamais apparaître comme encre d'un
       pixel de jeu : un pixel de jeu porte toujours un index de la table des seize. */
    WHITE: '#ffffff', BLACK: '#000000',
    CHAN: ['#ff0000', '#00ff00', '#0000ff']
  };
})();

/* ===== 05-art.js ===== */
/* Illustrations générées (GPT Image 2.5 Sunburst), converties en pixel art hors ligne : réduites à la
   résolution du jeu puis forcées dans la palette fermée de seize couleurs avec le même tramage de Bayer
   4x4 que le jeu emploie. Les PNG sources vivent dans proto-neon/art/ ; build.mjs les injecte ici sous
   forme d'URI de données dans ART_SRC, pour que le bundle reste un seul fichier.

   Format rendu, identique à N.spr.make : {w, h, data: Uint8Array} d'index de palette, 0 = transparent.
   Comme l'index 0 (« vide ») est aussi une vraie couleur, très présente dans les fonds, il est remplacé
   ici par l'index 15 (« nuit profonde »), visuellement presque identique. Rien n'est perdu et la règle
   « 0 = transparent » tient partout.

   Le décodage est asynchrone (le navigateur décode le PNG) mais prend quelques millisecondes : get()
   rend null tant qu'une image n'est pas prête, et l'appelant dessine son repli procédural en attendant. */

N.art = (function () {
  var cache = {}, ready = false, pending = null;
  var SRC = (typeof ART_SRC !== 'undefined') ? ART_SRC : {};

  function table() {
    var C = (N.pal && N.pal.C) || ['#0d0221', '#190b28', '#241734', '#541388', '#2d1b69', '#ff2a6d', '#ff8fab', '#05d9e8',
      '#d1f7ff', '#ff9e00', '#ffd319', '#ff5714', '#fffce8', '#8a8fa3', '#8b0f3a', '#01012b'];
    return C.map(function (h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; });
  }

  /* index de palette le plus proche ; robuste à une éventuelle gestion de couleur du navigateur */
  function nearest(T, r, g, b) {
    var best = 0, bd = 1e9;
    for (var i = 0; i < T.length; i++) {
      var dr = r - T[i][0], dg = g - T[i][1], db = b - T[i][2], d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; best = i; if (d === 0) break; }
    }
    return best;
  }

  function decode(name, uri) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth, h = img.naturalHeight;
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var x = c.getContext('2d', { willReadFrequently: true });
          x.imageSmoothingEnabled = false;
          x.drawImage(img, 0, 0);
          var px = x.getImageData(0, 0, w, h).data, T = table();
          var data = new Uint8Array(w * h), memo = {};
          for (var i = 0, j = 0; i < data.length; i++, j += 4) {
            if (px[j + 3] < 128) { data[i] = 0; continue; }
            var k = (px[j] << 16) | (px[j + 1] << 8) | px[j + 2];
            var ci = memo[k];
            if (ci === undefined) ci = memo[k] = nearest(T, px[j], px[j + 1], px[j + 2]);
            data[i] = ci === 0 ? 15 : ci;                 // 0 réservé à la transparence
          }
          cache[name] = { w: w, h: h, data: data };
        } catch (e) { cache[name] = null; }
        resolve();
      };
      img.onerror = function () { cache[name] = null; resolve(); };
      img.src = uri;
    });
  }

  return {
    /* noms disponibles : affiche, horizon, briefing, logo */
    names: function () { return Object.keys(SRC); },
    /* lance le décodage de toutes les illustrations ; rend une promesse */
    load: function () {
      if (pending) return pending;
      var jobs = Object.keys(SRC).map(function (n) { return decode(n, SRC[n]); });
      pending = Promise.all(jobs).then(function () { ready = true; });
      return pending;
    },
    ready: function () { return ready; },
    /* {w, h, data} ou null tant que ce n'est pas décodé */
    get: function (name) { return cache[name] || null; },
  };
})();

/* ===== 10-gfx.js ===== */
/* ===== 10-gfx.js — le tampon basse résolution, la mise à l'échelle, les primitives =====

   LES GROS PIXELS SONT RÉELS, PAS SIMULÉS. Tout le jeu se dessine dans un Uint8Array d'index de
   palette de W x H. Une seule fois par image, ce tampon est composé vers un canvas interne W x H par
   un ImageData, puis present() l'agrandit en voisin le plus proche vers le canvas de sortie.
   C'est la seule chaîne qui garantisse un carré net, et c'est aussi la plus rapide : sur iPhone
   844x390 à px = 2 on dessine 422x195 = 82 290 pixels au lieu de 329 160, soit neuf fois moins.

   Conséquences pour qui dessine :
     - un pixel de jeu ne peut porter qu'un index 0..15. Pas d'alpha, pas de dégradé : trame
       (N.pal.dither) ou ombre (N.pal.shade).
     - toutes les primitives arrondissent leurs coordonnées. Un sprite ne tombe jamais entre deux
       pixels, même si on lui passe une position flottante.
     - rien ici ne lit l'horloge et rien n'écrit de couleur : la table vient de N.pal.

   Interface imposée par CONTRAT.md :
     N.gfx.init(canvasSortie) / resize(cssW,cssH) -> {w,h,px} / W,H,PX
     clear(ci) / px(x,y,ci) / rect(x,y,w,h,ci) / line(x0,y0,x1,y1,ci) / circ(x,y,r,ci)
     ring(x,y,r,ci,t) / blit(sprite,x,y,opts) / present()

   Extras publiés en plus, parce que le look du prototype en dépend :
     ditherRect(x,y,w,h,ci,t)   aplat tramé — voiles, dégradés de ciel, halos carrés
     ditherCirc(x,y,r,ci,t)     disque tramé — le cœur d'une explosion
     disc(x,y,r0,r1,ci,t)       couronne épaisse tramée, de r0 à r1
     buf()                      le Uint8Array d'index, en lecture directe (tests, 20-crt.js)
     canvas() / context()       le canvas de sortie et son contexte (20-crt.js en a besoin)
     at(x,y)                    l'index posé en (x,y), -1 hors tampon (tests)
*/
(function () {
  'use strict';
  var N = (typeof window !== 'undefined') ? (window.__N || (window.__N = {}))
    : (typeof globalThis !== 'undefined' ? (globalThis.__N || (globalThis.__N = {})) : {});

  var out = null, octx = null;          /* canvas de sortie, fourni par 90-boot.js */
  var ic = null, ictx = null;           /* canvas interne, exactement W x H */
  var img = null, u32 = null;           /* son ImageData et la vue 32 bits dessus */
  var buf = null;                       /* le tampon d'index : la vérité du rendu */
  var W = 0, H = 0, PX = 2;
  var smoothOK = false;                 /* le lissage a-t-il été désarmé depuis le dernier resize */

  var RND = Math.round;

  function mkCanvas(w, h) {
    var c;
    if (typeof document !== 'undefined' && document.createElement) c = document.createElement('canvas');
    else if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w, h);
    else return null;
    c.width = w; c.height = h;
    return c;
  }

  /* ---- taille : px = clamp(round(cssW/340), 2, 6), tampon = ceil(cssW/px) x ceil(cssH/px) ----
     Pas de letterbox : le tampon couvre tout l'écran, quitte à dépasser de moins d'un gros pixel. */
  function resize(cssW, cssH) {
    cssW = Math.max(1, cssW | 0); cssH = Math.max(1, cssH | 0);
    var p = RND(cssW / 340);
    if (!(p >= 2)) p = 2; if (p > 6) p = 6;
    var w = Math.ceil(cssW / p), h = Math.ceil(cssH / p);
    if (w === W && h === H && p === PX && buf) { smoothOK = false; return { w: W, h: H, px: PX }; }
    W = w; H = h; PX = p;
    buf = new Uint8Array(W * H);
    ic = mkCanvas(W, H);
    ictx = ic ? ic.getContext('2d', { alpha: false }) : null;
    if (ictx) {
      ictx.imageSmoothingEnabled = false;
      img = ictx.createImageData(W, H);
      u32 = new Uint32Array(img.data.buffer);
    } else { img = null; u32 = null; }
    smoothOK = false;
    N.gfx.W = W; N.gfx.H = H; N.gfx.PX = PX;
    return { w: W, h: H, px: PX };
  }

  function init(canvasSortie) {
    out = canvasSortie || null;
    octx = out ? out.getContext('2d', { alpha: false }) : null;
    smoothOK = false;
    if (!W || !H) {
      var cw = 0, ch = 0;
      if (typeof window !== 'undefined') { cw = window.innerWidth | 0; ch = window.innerHeight | 0; }
      resize(cw || 960, ch || 540);
    }
  }

  /* ---- primitives ---- */
  function clear(ci) { if (buf) buf.fill((ci | 0) & 15); }

  function px(x, y, ci) {
    x = RND(x); y = RND(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    buf[y * W + x] = (ci | 0) & 15;
  }

  function at(x, y) {
    x = RND(x); y = RND(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return -1;
    return buf[y * W + x];
  }

  /* remplit une portion de ligne, déjà en entiers, sans vérifier deux fois les bornes */
  function row(x0, x1, y, c) {
    if (y < 0 || y >= H) return;
    if (x0 < 0) x0 = 0;
    if (x1 > W - 1) x1 = W - 1;
    if (x1 < x0) return;
    var o = y * W;
    buf.fill(c, o + x0, o + x1 + 1);
  }

  function rect(x, y, w, h, ci) {
    x = RND(x); y = RND(y); w = RND(w); h = RND(h);
    if (w <= 0 || h <= 0) return;
    var c = (ci | 0) & 15, y1 = y + h - 1, x1 = x + w - 1;
    if (y < 0) y = 0; if (y1 > H - 1) y1 = H - 1;
    for (var yy = y; yy <= y1; yy++) row(x, x1, yy, c);
  }

  function ditherRect(x, y, w, h, ci, t) {
    if (t === undefined) t = 1;
    if (t >= 1) return rect(x, y, w, h, ci);
    if (!(t > 0)) return;
    x = RND(x); y = RND(y); w = RND(w); h = RND(h);
    var c = (ci | 0) & 15, D = N.pal.dither;
    var x0 = x < 0 ? 0 : x, y0 = y < 0 ? 0 : y;
    var x1 = x + w - 1, y1 = y + h - 1;
    if (x1 > W - 1) x1 = W - 1; if (y1 > H - 1) y1 = H - 1;
    for (var yy = y0; yy <= y1; yy++) {
      var o = yy * W;
      for (var xx = x0; xx <= x1; xx++) if (D(xx, yy, t)) buf[o + xx] = c;
    }
  }

  /* Bresenham entier : aucune position intermédiaire, aucun lissage */
  function line(x0, y0, x1, y1, ci) {
    x0 = RND(x0); y0 = RND(y0); x1 = RND(x1); y1 = RND(y1);
    var c = (ci | 0) & 15;
    var dx = x1 - x0 < 0 ? x0 - x1 : x1 - x0;
    var dy = y1 - y0 < 0 ? y0 - y1 : y1 - y0;
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    var err = dx - dy, e2;
    /* garde-fou : une ligne absurde ne doit pas geler l'image */
    var guard = dx + dy + 4;
    for (;;) {
      if (x0 >= 0 && y0 >= 0 && x0 < W && y0 < H) buf[y0 * W + x0] = c;
      if (x0 === x1 && y0 === y1) break;
      if (--guard < 0) break;
      e2 = err + err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  function circ(x, y, r, ci) {
    x = RND(x); y = RND(y); r = RND(r);
    if (r < 0) return;
    var c = (ci | 0) & 15, rr = r * r;
    var dy0 = -r, dy1 = r;
    if (y + dy0 < 0) dy0 = -y; if (y + dy1 > H - 1) dy1 = H - 1 - y;
    for (var dy = dy0; dy <= dy1; dy++) {
      var dx = (Math.sqrt(rr - dy * dy) + 0.5) | 0;
      row(x - dx, x + dx, y + dy, c);
    }
  }

  function ditherCirc(x, y, r, ci, t) {
    if (t === undefined) t = 1;
    if (t >= 1) return circ(x, y, r, ci);
    if (!(t > 0)) return;
    x = RND(x); y = RND(y); r = RND(r);
    if (r < 0) return;
    var c = (ci | 0) & 15, rr = r * r, D = N.pal.dither;
    var dy0 = -r, dy1 = r;
    if (y + dy0 < 0) dy0 = -y; if (y + dy1 > H - 1) dy1 = H - 1 - y;
    for (var dy = dy0; dy <= dy1; dy++) {
      var dx = (Math.sqrt(rr - dy * dy) + 0.5) | 0;
      var yy = y + dy, o = yy * W;
      var a = x - dx, b = x + dx;
      if (a < 0) a = 0; if (b > W - 1) b = W - 1;
      for (var xx = a; xx <= b; xx++) if (D(xx, yy, t)) buf[o + xx] = c;
    }
  }

  /* Couronne épaisse tramée, de r0 à r1 : une explosion est une forme, pas un flou. */
  function disc(x, y, r0, r1, ci, t) {
    if (t === undefined) t = 1;
    x = RND(x); y = RND(y); r0 = RND(r0); r1 = RND(r1);
    if (r1 < r0) { var sw = r0; r0 = r1; r1 = sw; }
    if (r1 < 0) return;
    if (r0 < 0) r0 = 0;
    var c = (ci | 0) & 15, a2 = r0 * r0, b2 = r1 * r1, D = N.pal.dither, full = t >= 1;
    var dy0 = -r1, dy1 = r1;
    if (y + dy0 < 0) dy0 = -y; if (y + dy1 > H - 1) dy1 = H - 1 - y;
    for (var dy = dy0; dy <= dy1; dy++) {
      var yy = y + dy, o = yy * W, d2 = dy * dy;

  octx.fillText('modules : ' + Object.keys(N).filter(function (k) { return k !== 'S'; }).join(' '), 12, 44);
}

/* ---- entrées : un seul point d'entrée, clavier et doigt ---- */
var keys = {};
function onKey(e, down) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.repeat) return;
  keys[e.code] = down;
  if (down) S.input.any = true;
  var l = keys.ArrowLeft || keys.KeyA || keys.KeyQ, r = keys.ArrowRight || keys.KeyD;
  var u = keys.ArrowUp || keys.KeyW || keys.KeyZ, d = keys.ArrowDown || keys.KeyS;
  S.input.x = (r ? 1 : 0) - (l ? 1 : 0); S.input.y = (d ? 1 : 0) - (u ? 1 : 0);
  S.input.mag = (S.input.x || S.input.y) ? 1 : 0;
  S.input.fire = !!(keys.Space || keys.KeyK);
  if (down && (e.code === 'Space' || e.code === 'Enter')) startAudio();
  if (down) e.preventDefault();
}
function onTouch(e) {
  S.input.any = true; startAudio();
  var t = e.touches && e.touches[0]; if (!t) { S.input.mag = 0; return; }
  var cx = window.innerWidth * 0.5, cy = window.innerHeight * 0.5;
  var dx = t.clientX - cx, dy = t.clientY - cy, m = Math.hypot(dx, dy) || 1;
  S.input.x = dx / m; S.input.y = dy / m; S.input.mag = Math.min(1, m / (window.innerHeight * 0.3));
  if (e.cancelable) e.preventDefault();
}
var audioStarted = false;
function startAudio() {
  if (audioStarted) return; audioStarted = true;
  step('music.init', N.music && N.music.init ? function () { N.music.init(); N.music.start(); } : null);
}

/* ---- boucle ---- */
var last = 0, DTMAX = 1 / 20;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = last ? (now - last) / 1000 : 1 / 60;
  last = now;
  if (typeof window !== 'undefined' && window.__DT) dt = window.__DT;
  if (dt > DTMAX) dt = DTMAX;
  if (dt < 0) dt = 0;

  var frozen = N.fx && N.fx.hitstopLeft ? N.fx.hitstopLeft() > 0 : false;
  S.dt = frozen ? dt * 0.08 : dt;
  S.t += S.dt * 1000;
  S.frame++;
  if (typeof window !== 'undefined') window.__FRAME = S.frame;

  if (!S.paused) {
    if (S.phase === 'intro') step('intro.update', N.intro && N.intro.update ? function () { N.intro.update(S.dt); } : null);
    else step('game.update', N.game && N.game.update ? function () { N.game.update(S.dt); } : null);
    step('fx.update', N.fx && N.fx.update ? function () { N.fx.update(S.dt); } : null);
  }

  if (N.game && N.game.tension) step('tension', function () {
    S.tension = N.game.tension();
    if (N.music && N.music.tension) N.music.tension(S.tension);
  });

  /* dessin : tampon basse résolution, puis agrandissement, puis post-traitement */
  var drew = false;
  if (N.gfx && N.gfx.clear) {
    step('gfx.clear', function () { N.gfx.clear(0); });
    if (S.phase === 'intro') step('intro.draw', N.intro && N.intro.draw ? function () { N.intro.draw(); drew = true; } : null);
    else step('game.draw', N.game && N.game.draw ? function () { N.game.draw(); drew = true; } : null);
    step('fx.draw', N.fx && N.fx.draw ? function () { N.fx.draw(); } : null);
    step('gfx.present', function () { N.gfx.present(); drew = drew || true; });
    step('crt.apply', N.crt && N.crt.apply ? function () { N.crt.apply(S.dt); } : null);
  }
  if (!drew) step('mire', mire);

  /* décroissance des secousses après lecture par le post-traitement */
  if (S.shake > 0) { S.shake *= Math.pow(0.001, S.dt); if (S.shake < 0.05) S.shake = 0; }
  if (S.heat > 0) { S.heat *= Math.pow(0.02, S.dt); if (S.heat < 0.01) S.heat = 0; }
}

function boot() {
  out = document.getElementById('out');
  if (!out) { errLog('boot', new Error('canvas #out absent')); return; }
  octx = out.getContext('2d', { alpha: false });
  if (typeof window !== 'undefined') {
    window.__S = S; window.__PAL = palTable();
    if (window.__SEED) N.reseed(window.__SEED);
  }
  step('gfx.init', N.gfx && N.gfx.init ? function () { N.gfx.init(out); } : null);
  step('art.load', N.art && N.art.load ? function () { N.art.load(); } : null);
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  window.addEventListener('keydown', function (e) { onKey(e, true); }, { passive: false });
  window.addEventListener('keyup', function (e) { onKey(e, false); });
  var app = document.getElementById('app') || window;
  app.addEventListener('touchstart', onTouch, { passive: false });
  app.addEventListener('touchmove', onTouch, { passive: false });
  app.addEventListener('touchend', function (e) { S.input.mag = 0; if (e.cancelable) e.preventDefault(); }, { passive: false });
  app.addEventListener('pointerdown', startAudio);
  window.addEventListener('blur', function () { keys = {}; S.input.mag = 0; S.input.fire = false; });

  step('intro.reset', N.intro && N.intro.reset ? function () { N.intro.reset(); } : null);
  step('game.reset', N.game && N.game.reset ? function () { N.game.reset(S.seed); } : null);
  requestAnimationFrame(frame);
}

boot();})();</script>
