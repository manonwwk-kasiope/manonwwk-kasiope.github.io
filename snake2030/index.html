var _lvHitOpt = { x: 0, y: 0, type: 'shock' };

/* Caches de dégradés */
var _lvBloomG = [];
var _lvBloomP = [];
var _lvVigG = null, _lvVigKey = '';
var _lvDngG = null, _lvDngKey = '';
var _lvGradW = 0, _lvGradH = 0;

/* ======
   PETITES AIDES
   ====== */

var _lvRgbC = {};
function _lvRgb(hex) {
  var v = _lvRgbC[hex];
  if (v) return v;
  var h = hex.charAt(0) === '#' ? hex.substring(1) : hex;
  if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  var n = parseInt(h, 16);
  v = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  _lvRgbC[hex] = v;
  return v;
}
/* Uniquement pour les arrêts de dégradés, construits une fois puis mis en cache. */
function _lvRgba(hex, a) { return 'rgba(' + _lvRgb(hex) + ',' + a + ')'; }

function _lvHazGet(kind) {
  var h = _lvHazPool.pop();
  if (!h) {
    h = { kind: '', x: 0, y: 0, vx: 0, vy: 0, w2: 0, h2: 0, r: 0, r2: 0,
          pull: 0, str: 0, ax: 0, dir: 1, lane: 0, warn: 0, life: 0, ph: 0, col: '#ffffff' };
  }
  h.kind = kind; h.vx = 0; h.vy = 0; h.warn = 0; h.life = 0; h.ph = rnd() * TAU;
  _lvHaz.push(h);
  return h;
}
function _lvHazDrop(i) {
  var h = _lvHaz[i];
  _lvHaz.splice(i, 1);
  if (_lvHazPool.length < 64) _lvHazPool.push(h);
}
function _lvHazClear() {
  while (_lvHaz.length) _lvHazDrop(_lvHaz.length - 1);
  _lvMag.length = 0;
}

function _lvSay(title) {
  if (S.phase !== 'play') return;
  if (S2030.ui && S2030.ui.banner) S2030.ui.banner(title);
}
function _lvHint(title, sub) {
  if (S.phase !== 'play') return;
  if (S2030.ui && S2030.ui.toast) S2030.ui.toast(title, sub);
}

/* enemiesNear renvoie un tampon partagé par le cœur : on le recopie avant
   d'infliger des dégâts, car une mort peut relancer une requête imbriquée. */
function _lvCollect(x, y, r) {
  var l = enemiesNear(x, y, r);
  _lvNear.length = 0;
  for (var i = 0; i < l.length; i++) _lvNear.push(l[i]);
  return _lvNear;
}

/* ======
   POINTS D'APPARITION
   Remplit _lvPX / _lvPY. Toujours dans l'arène, de préférence hors champ.
   ====== */

var _lvVisW = 640, _lvVisH = 390;
/* demi-étendue à couvrir : le plus grand du tampon caméra et de l'étendue
   réellement montrée (phases.visibleExtent) — R part de là, +150 u */
var _lvAntX = 0, _lvAntY = 0;
function _lvVisHalf() {
  var P = S2030.phases, V = (P && P.visibleExtent) ? P.visibleExtent() : null, s = S.snake;
  _lvVisW = S.view.w * 0.5; _lvVisH = S.view.h * 0.5;
  // caméra anticipée : pendant les 600 ms du portail elle avance d'environ
  // 0,6 s de course plus son avance (0,55 s) — un point tout juste caché
  // maintenant serait dans le champ à l'éclosion
  _lvAntX = s ? s.x + Math.cos(s.ang) * s.speed * 1.15 : S.cam.x;
  _lvAntY = s ? s.y + Math.sin(s.ang) * s.speed * 1.15 : S.cam.y;
  if (V) {
    if (V.left > _lvVisW) _lvVisW = V.left;
    if (V.right > _lvVisW) _lvVisW = V.right;
    if (V.top > _lvVisH) _lvVisH = V.top;
    if (V.bottom > _lvVisH) _lvVisH = V.bottom;
  }
}

/* Un point d'apparition n'est bon que s'il est DANS l'arène et HORS de tout
   ce que le joueur peut voir : ni l'étendue montrée (inView, marge 40), ni le
   cadre brut de la caméra, qui la déborde sous certaines bascules. */
function _lvHidden(x, y) {
  if (x < _LV_MARGIN || x > K.ARENA_W - _LV_MARGIN || y < _LV_MARGIN || y > K.ARENA_H - _LV_MARGIN) return false;
  if (inView(x, y, 40)) return false;
  return Math.abs(x - S.cam.x) > S.view.w * 0.5 + 40 || Math.abs(y - S.cam.y) > S.view.h * 0.5 + 40;
}
/* même test, contre la caméra anticipée : sert au choix du point, pas à l'éclosion */
function _lvHiddenSoon(x, y) {
  if (!_lvHidden(x, y)) return false;
  return Math.abs(x - _lvAntX) > S.view.w * 0.5 + 40 || Math.abs(y - _lvAntY) > S.view.h * 0.5 + 40;
}

/* Repli déterministe : bords et coins de l'arène. Le monde (2600x1600) est
   toujours plus grand que la vue, donc l'un d'eux est caché. */
var _LV_FBX = [0, 0, -1, 1, -1, -1, 1, 1], _LV_FBY = [-1, 1, 0, 0, -1, 1, -1, 1];
function _lvFallback() {
  var s = S.snake, lo = _LV_MARGIN + 20;
  for (var k = 0; k < 8; k++) {
    var x = _LV_FBX[k] ? (_LV_FBX[k] < 0 ? lo : K.ARENA_W - lo) : clamp(s.x, lo, K.ARENA_W - lo);
    var y = _LV_FBY[k] ? (_LV_FBY[k] < 0 ? lo : K.ARENA_H - lo) : clamp(s.y, lo, K.ARENA_H - lo);
    if (_lvHiddenSoon(x, y)) { _lvPX = x; _lvPY = y; return true; }
  }
  _lvClampPoint();
  return false;
}

/* Tous les motifs tirent à R >= max(view.w, view.h)/2 + 150 et revérifient
   !inView(x, y, 40) ; cinq essais, puis repli. */
function _lvPoint(pat, i, n) {
  var s = S.snake;
  if (!s) { _lvPX = K.ARENA_W * 0.5; _lvPY = K.ARENA_H * 0.5; return; }
  _lvVisHalf();
  /* Rayon : la DIAGONALE de la demi-vue, pas son plus grand côté. Le point le
     plus éloigné réellement visible est le COIN, à hypot(w, h) / 2 ; sur une
     fenêtre presque carrée (rendue jouable par G2) max(w, h) / 2 + 150 ne le
     domine pas, et le roulis de la caméra achève de faire naître l'ennemi sous
     les yeux. hypot(demi-w, demi-h) + 150 domine le coin par construction,
     quelle que soit la forme de la fenêtre et quel que soit le roulis ; il
     reste >= max(view.w, view.h) / 2 + 150, la borne exigée. */
  var off = Math.sqrt(_lvVisW * _lvVisW + _lvVisH * _lvVisH) + 150;
  var a, R, k, ln;

  if (pat === 'corner') {
    _lvPX = (i % 2) ? K.ARENA_W - _LV_MARGIN * 2 : _LV_MARGIN * 2;
    _lvPY = (((i / 2) | 0) % 2) ? K.ARENA_H - _LV_MARGIN * 2 : _LV_MARGIN * 2;
    if (!_lvHiddenSoon(_lvPX, _lvPY)) _lvFallback();
    return;
  }

  // grappe : le point de bord est tiré une fois par salve, les suivants collent
  if (pat === 'pack' && i > 0) {
    for (k = 0; k < 5; k++) {
      _lvPX = _lvPackX + rndR(-70, 70);
      _lvPY = _lvPackY + rndR(-70, 70);
      if (_lvHiddenSoon(_lvPX, _lvPY)) return;
    }
    _lvPX = _lvPackX; _lvPY = _lvPackY;
    if (!_lvHiddenSoon(_lvPX, _lvPY)) _lvFallback();
    return;
  }

  for (k = 0; k < 5; k++) {
    if (pat === 'lane' && _lvLanes.length) {
      ln = _lvLanes[rndI(0, _lvLanes.length - 1)];
      if (ln.ax === 0) {
        _lvPX = s.x - ln.dir * (off + rndR(0, 240));
        _lvPY = ln.pos + rndR(-ln.h * 0.32, ln.h * 0.32);
      } else {
        _lvPY = s.y - ln.dir * (off + rndR(0, 240));
        _lvPX = ln.pos + rndR(-ln.h * 0.32, ln.h * 0.32);
      }
    } else {
      if (pat === 'ahead') { a = s.ang + rndR(-0.45, 0.45); R = off + rndR(0, 190); }
      else if (pat === 'flank') { a = s.ang + ((i & 1) ? 1 : -1) * (Math.PI * 0.5) + rndR(-0.28, 0.28); R = off + rndR(0, 300); }
      else if (pat === 'ring') { a = _lvRingA + (i / Math.max(1, n)) * TAU + (k ? rndR(-0.35, 0.35) : 0); R = off + rndR(0, 160); }
      else { a = rnd() * TAU; R = off + rndR(0, 240); }          // 'edge' et tout le reste
      _lvPX = s.x + Math.cos(a) * R;
      _lvPY = s.y + Math.sin(a) * R;
    }
    if (_lvHiddenSoon(_lvPX, _lvPY)) { if (pat === 'pack') { _lvPackX = _lvPX; _lvPackY = _lvPY; } return; }
  }
  _lvFallback();
  if (pat === 'pack') { _lvPackX = _lvPX; _lvPackY = _lvPY; }
}
var _lvPackX = 0, _lvPackY = 0;

function _lvClampPoint() {
  _lvPX = clamp(_lvPX, _LV_MARGIN, K.ARENA_W - _LV_MARGIN);
  _lvPY = clamp(_lvPY, _LV_MARGIN, K.ARENA_H - _LV_MARGIN);
}

/* ======
   PORTAILS D'APPARITION
   Rien n'arrive sans prévenir : 600 ms avant chaque apparition, un chevron de
   bord de la couleur du type (double pour une élite), un tic sonore, et une
   ligne dans S.log si un test l'écoute.
   ====== */

var _LV_PORTAL = 600;
var _lvPend = [], _lvPendPool = [], _lvPortalId = 0;

function _lvLog(o) { if (S.log && S.log.push && S.log.length < 20000) S.log.push(o); }

function _lvColorOf(type) {
  var D = S2030.enemies && S2030.enemies.defs, d = D && D[type];
  return (d && d.color) || '#ffffff';
}

function _lvPortal(type, x, y, elite, mod, boss) {
  var p = _lvPendPool.length ? _lvPendPool.pop() : {};
  p.type = type; p.x = x; p.y = y; p.elite = !!elite; p.mod = mod || null; p.boss = !!boss;
  p.t = S.t + _LV_PORTAL; p.color = _lvColorOf(type); p.id = ++_lvPortalId;
  _lvPend.push(p);
  S2030.audio && S2030.audio.sfx('spawnTick', { x: x, vol: elite ? 1 : 0.8 });
  S2030.fx && S2030.fx.edge(x, y, p.color, { dbl: p.elite, size: 24 });
  _lvLog({ t: S.t, kind: 'portal', ev: 'portal', type: type, elite: p.elite, mod: p.mod,
           boss: p.boss, x: Math.round(x), y: Math.round(y), lead: _LV_PORTAL, edge: 1, pid: p.id });
  return p;
}

/* La caméra a bougé pendant les 600 ms d'annonce : si le point est entré dans
   le champ, on le repousse vers l'extérieur avant de faire éclore. */
function _lvHatchFix(p) {
  if (_lvHidden(p.x, p.y)) return;
  _lvVisHalf();
  var a = angTo(S.cam.x, S.cam.y, p.x, p.y), k;
  for (k = 0; k < 10; k++) {
    p.x = clamp(p.x + Math.cos(a) * 80, _LV_MARGIN, K.ARENA_W - _LV_MARGIN);
    p.y = clamp(p.y + Math.sin(a) * 80, _LV_MARGIN, K.ARENA_H - _LV_MARGIN);
    if (_lvHidden(p.x, p.y)) return;
  }
  var sx = _lvPX, sy = _lvPY;
  if (_lvFallback()) { p.x = _lvPX; p.y = _lvPY; }
  _lvPX = sx; _lvPY = sy;
}

function _lvHatch(p) {
  _lvHatchFix(p);
  var m = null;
  if (p.elite || p.mod) { m = _lvMods; m.elite = p.elite; m.mod = p.mod; }
  var e = spawnEnemy(p.type, p.x, p.y, m);
  if (!e) return;
  _lvLog({ t: S.t, kind: 'spawn', ev: 'spawn', type: p.type, elite: p.elite, boss: p.boss,
           id: e.id, x: Math.round(p.x), y: Math.round(p.y), pid: p.id });
  // brève déchirure d'arrivée, aux couleurs de l'ennemi
  if (S2030.fx) S2030.fx.ring(p.x, p.y, e.color, 4, 340, { w: 2, life: 0.3 });
  if (p.boss) _lvBossBorn(e);
}

/* Éclosion dans l'ORDRE D'ANNONCE : une salve arrive dans l'ordre où ses
   chevrons se sont allumés (et la composition d'une vague reste celle du
   tableau de niveau). */
var _lvPortalF = 0;
function _lvPortalTick() {
  var i = 0;
  _lvPortalF++;
  while (i < _lvPend.length) {
    var p = _lvPend[i];
    // le point corrigé est mémorisé dans p : une vérification sur quatre suffit
    // pour suivre la caméra (elle avance de ~9 u par image), et l'éclosion la
    // refait toujours. C'est ce qui évitait des salves de travail par image.
    if (((_lvPortalF + p.id) & 3) === 0) _lvHatchFix(p);
    if (S.t < p.t) {
      S2030.fx && S2030.fx.edge(p.x, p.y, p.color, { dbl: p.elite, size: 24 });
      i++; continue;
    }
    _lvPend.splice(i, 1);
    _lvHatch(p);
    if (_lvPendPool.length < 48) _lvPendPool.push(p);
  }
}

function _lvPendClear() {
  while (_lvPend.length) { var p = _lvPend.pop(); if (_lvPendPool.length < 48) _lvPendPool.push(p); }
}

/* ======
   VAGUES
   ====== */

function _lvSpawnGroup(type, n, pat, eliteP, mods) {
  for (var i = 0; i < n; i++) {
    if (S.enemies.length + _lvPend.length >= _LV_HARDCAP) return;
    _lvPoint(pat, i, n);
    var el = false, md = null;
    if (eliteP && chance(eliteP)) {
      el = true;
      md = (mods && mods.length) ? pick(mods) : null;
    } else if (mods && mods.length && chance(0.10 + _lvCycle * 0.02)) {
      md = pick(mods);
    }
    _lvPortal(type, _lvPX, _lvPY, el, md, false);
  }
}
var _lvMods = { elite: false, mod: null };   // objet de mods réutilisé

function _lvFireWave(w) {
  var mods = w.mods || _lvDef.mods;
  var eliteP = (w.eliteP || 0) + _lvCycle * 0.02;
  for (var i = 0; i < w.g.length; i++) {
    var g = w.g[i];
    var n = g[1];
    if (_lvCycle > 0) n = Math.min(n + ((_lvCycle / 3) | 0), n + 3);
    _lvSpawnGroup(g[0], n, g[2], eliteP, mods);
  }
}

function _lvWaves(dt) {
  var ph = _LV_PHASES[_lvPhaseI];
  if (ph === 'clear') return;
  var sp = _lvDef.spawns;
  var rate = _lvCycle > 0 ? Math.max(0.55, 1 - _lvCycle * 0.055) : 1;
  var capB = _lvCycle > 0 ? Math.min(46, _lvCycle * 6) : 0;
  // la difficulté resserre les salves et relève le plafond simultané : c'est
  // là qu'elle se sent le plus, bien avant les points de vie des ennemis
  var dm = diffMul();
  rate /= Math.pow(dm, 0.85);
  var capM = Math.pow(dm, 0.55);

  for (var i = 0; i < sp.length; i++) {
    var w = sp[i];
    if (w.p !== ph) continue;
    _lvWaveT[i] -= dt;
    if (_lvWaveT[i] > 0) continue;
    _lvWaveT[i] = w.every * rate * rndR(1 - (w.jit || 0.5) * 0.35, 1 + (w.jit || 0.5) * 0.35);
    var cap = Math.min(_LV_HARDCAP, Math.round((w.cap + capB) * capM));
    if (S.enemies.length + _lvPend.length >= cap) continue;
    _lvFireWave(w);
  }
}

/* ======
   PHASES
   ====== */

function _lvEnterPhase(idx) {
  _lvPhaseI = idx;
  _lvPhaseT = 0;
  var ph = _LV_PHASES[idx];
  _lvPhaseRaw = _lvDef.dur[ph] || 10;
  _lvPhaseDur = _lvPhaseRaw;
  if (_lvCycle > 0 && ph !== 'climax' && ph !== 'clear') {
    _lvPhaseDur = Math.max(8, _lvPhaseDur * (1 - Math.min(0.35, _lvCycle * 0.04)));
  }
  _lvBefore = 0;
  for (var i = 0; i < idx; i++) _lvBefore += _lvDef.dur[_LV_PHASES[i]] || 10;

  // amorce des minuteries de la phase : la première salve part tout de suite
  for (var w = 0; w < _lvDef.spawns.length; w++) {
    if (_lvDef.spawns[w].p === ph) _lvWaveT[w] = Math.max(0.02, rndR(0.2, 1.4) - _LV_PORTAL / 1000);
  }

  if (ph === 'rise') {
    if (S2030.fx) S2030.fx.flash(_lvPal.accent, 0.10);
  } else if (ph === 'surge') {
    _lvSay('SURCHARGE DU SECTEUR');
    if (S2030.fx) { S2030.fx.flash(_lvPal.gridHot, 0.16); S2030.fx.glitch(0.4); }
    if (S2030.audio) S2030.audio.sfx('zap');
  } else if (ph === 'climax') {
    _lvClimax();
  } else if (ph === 'clear') {
    _lvClearPhase();
  }
}

function _lvClimax() {
  var b = _lvDef.boss;
  _lvElites.length = 0;
  _lvBoss = null;
  if (!b) return;

  _lvSay(b.name);
  if (S2030.audio) S2030.audio.sfx('bossIn');
  if (S2030.fx) { S2030.fx.flash(_lvPal.danger, 0.30); S2030.fx.shake(16); S2030.fx.glitch(0.7); }

  var count = b.n + ((_lvCycle / 2) | 0);
  if (count > 4) count = 4;
  _lvBossName = b.name || '';
  for (var i = 0; i < count; i++) {
    _lvPoint('ring', i, count);
    _lvPortal(b.type, _lvPX, _lvPY, true, b.mod || pick(_lvDef.mods || _LV_ALLMODS), true);
  }
  if (b.escort) {
    for (var k = 0; k < b.escort.length; k++) {
      var g = b.escort[k];
      _lvSpawnGroup(g[0], g[1], g[2], 0, null);
    }
  }
}

function _lvClearPhase() {
  S.boss = null;
  _lvBoss = null;
  _lvElites.length = 0;
  var s = S.snake;
  if (!s) return;
  _lvSay('SECTEUR NETTOYÉ');
  if (S2030.audio) S2030.audio.sfx('warp');
  if (S2030.fx) {
    S2030.fx.flash(_lvPal.accent, 0.22);
    S2030.fx.ring(s.x, s.y, _lvPal.accent, 20, 1100, { w: 7, life: 0.9 });
  }
  // récompense de fin de secteur : de quoi souffler avant la suite
  for (var i = 0; i < 3; i++) {
    var a = rnd() * TAU, r = rndR(70, 150);
    addPickup('core', clamp(s.x + Math.cos(a) * r, 40, K.ARENA_W - 40),
                      clamp(s.y + Math.sin(a) * r, 40, K.ARENA_H - 40));
  }
  addPickup('heal', clamp(s.x + rndR(-90, 90), 40, K.ARENA_W - 40),
                    clamp(s.y + rndR(-90, 90), 40, K.ARENA_H - 40));
}

/* Une élite de climax franchit son portail : elle rejoint le groupe et, si la
   place est libre, prend la jauge de boss. */
var _lvBossName = '';
function _lvBossBorn(e) {
  e.name = _lvBossName || e.name;
  e.boss = 1;
  if (_lvCycle > 0) { e.hp = e.maxHp = Math.round(e.maxHp * (1 + _lvCycle * 0.22)); }
  _lvElites.push(e);
  if (S2030.fx) {
    S2030.fx.ring(e.x, e.y, _lvPal.danger, 12, 620, { w: 6, life: 0.6 });
    S2030.fx.flare(e.x, e.y, _lvPal.danger, 150, { life: 0.5, a: 0.9 });
  }
  if (!_lvBoss || _lvBoss.dead) {
    _lvBoss = e;
    S.boss = _lvBoss;
    S.bossHpMax = _lvBoss.maxHp;
  }
}

function _lvPhaseTick(dt) {
  _lvPhaseT += dt;
  var ph = _LV_PHASES[_lvPhaseI];

  if (ph === 'climax') {
    // le climax tombe quand les élites tombent — ou par forfait de temps
    var alive = 0;
    for (var i = 0; i < _lvElites.length; i++) if (!_lvElites[i].dead) alive++;
    if (_lvBoss && _lvBoss.dead) {
      // on relaie sur l'élite suivante encore debout, pour la jauge de l'UI
      _lvBoss = null;
      for (var j = 0; j < _lvElites.length; j++) {
        if (!_lvElites[j].dead) { _lvBoss = _lvElites[j]; break; }
      }
      S.boss = _lvBoss;
      S.bossHpMax = _lvBoss ? _lvBoss.maxHp : 0;
    }
    if ((_lvElites.length && alive === 0 && !_lvPend.length) || _lvPhaseT > _lvPhaseDur) {
      _lvEnterPhase(4);
    }
    return;
  }

  if (_lvPhaseT >= _lvPhaseDur) {
    if (_lvPhaseI >= 4) _lvStart(_lvN + 1);
    else _lvEnterPhase(_lvPhaseI + 1);
  }
}

/* ======
   INTENSITÉ ET PROGRESSION
   ====== */

var _LV_BASE_INT = { calm: 0.20, rise: 0.46, surge: 0.76, climax: 0.94, clear: 0.22 };

function _lvIntensity(dt) {
  var ph = _LV_PHASES[_lvPhaseI];
  var target = _LV_BASE_INT[ph];

  // la montée à l'intérieur d'une phase compte aussi
  var f = clamp(_lvPhaseT / Math.max(0.001, _lvPhaseDur), 0, 1);
  if (ph === 'rise' || ph === 'surge') target += f * 0.12;
  if (ph === 'clear') target -= f * 0.10;

  // densité : ce que l'on voit vraiment à l'écran
  var dens = S.enemies.length / 46;
  if (dens > 1) dens = 1;
  target += dens * 0.16;
  if (_lvBoss && !_lvBoss.dead) target += 0.06;
  if (_lvCycle > 0) target += Math.min(0.10, _lvCycle * 0.015);

  target = clamp(target, 0, 1);
  var k = 1 - Math.pow(0.06, dt);
  _lvIntens = lerp(_lvIntens, target, k);
  S.intensity = _lvIntens;

  S.levelProgress = clamp((_lvBefore + f * _lvPhaseRaw) / _lvTotalDur, 0, 1);
  S.levelPhase = ph;
}

/* ======
   MÉCANIQUE 2 — VOIES DE CIRCULATION
   ====== */

function _lvBuildLanes() {
  _lvLanes.length = 0;
  var d = _lvDef;
  if (!d.laneY) return;
  for (var i = 0; i < d.laneY.length; i++) {
    _lvLanes.push({
      ax: 0,
      pos: d.laneY[i] * K.ARENA_H,
      h: d.laneH,
      dir: (i & 1) ? -1 : 1,
      spd: rndR(d.rigSpd[0], d.rigSpd[1])
    });
  }
  // la surcharge ajoute du trafic transversal : l'arène devient un carrefour
  if (d.back.overload) {
    var nv = Math.min(3, 1 + ((_lvCycle / 2) | 0));
    for (var v = 0; v < nv; v++) {
      _lvLanes.push({
        ax: 1,
        pos: K.ARENA_W * (0.22 + 0.28 * v),
        h: d.laneH * 0.86,
        dir: (v & 1) ? -1 : 1,
        spd: rndR(d.rigSpd[0], d.rigSpd[1]) * 0.9
      });
    }
  }
}

function _lvRigTarget() {
  var d = _lvDef;
  if (!d.rigs) return 0;
  var ph = _LV_PHASES[_lvPhaseI];
  var f = ph === 'calm' ? 0.4 : ph === 'rise' ? 0.72 : ph === 'clear' ? 0.25 : 1;
  return Math.round(d.rigs * f) + ((_lvCycle * 1.4) | 0);
}

function _lvSpawnRig() {
  if (!_lvLanes.length) return;
  var ln = _lvLanes[rndI(0, _lvLanes.length - 1)];
  var r = _lvHazGet('rig');
  var long = rndR(88, 178) * (1 + _lvCycle * 0.06);
  var thick = ln.h * rndR(0.30, 0.42);
  var spd = ln.spd * rndR(0.86, 1.18) * (1 + _lvCycle * 0.05) * (1 + _lvIntens * 0.25);
  r.ax = ln.ax;
  r.dir = ln.dir;
  r.lane = ln.pos;
  if (ln.ax === 0) {
    r.w2 = long; r.h2 = thick;
    r.x = ln.dir > 0 ? -long - 20 : K.ARENA_W + long + 20;
    r.y = ln.pos + rndR(-ln.h * 0.22, ln.h * 0.22);
    r.vx = ln.dir * spd; r.vy = 0;
  } else {
    r.w2 = thick; r.h2 = long;
    r.y = ln.dir > 0 ? -long - 20 : K.ARENA_H + long + 20;
    r.x = ln.pos + rndR(-ln.h * 0.22, ln.h * 0.22);
    r.vy = ln.dir * spd; r.vx = 0;
  }
  r.col = chance(0.34) ? _lvPal.chrome : _lvPal.lane;
  r.warn = 0;
}

function _lvRigs(dt) {
  var d = _lvDef;
  if (!d.rigs) return;
  var want = _lvRigTarget();
  var live = 0, i;
  for (i = 0; i < _lvHaz.length; i++) if (_lvHaz[i].kind === 'rig') live++;

  _lvRigT -= dt;
  if (_lvRigT <= 0) {
    _lvRigT = rndR(0.5, 1.5) / (1 + _lvIntens);
    if (live < want) _lvSpawnRig();
  }

  var s = S.snake;
  for (i = _lvHaz.length - 1; i >= 0; i--) {
    var r = _lvHaz[i];
    if (r.kind !== 'rig') continue;
    r.x += r.vx * dt;
    r.y += r.vy * dt;

    // sortie d'arène
    if (r.ax === 0) {
      if ((r.dir > 0 && r.x - r.w2 > K.ARENA_W + 40) || (r.dir < 0 && r.x + r.w2 < -40)) { _lvHazDrop(i); continue; }
    } else {
      if ((r.dir > 0 && r.y - r.h2 > K.ARENA_H + 40) || (r.dir < 0 && r.y + r.h2 < -40)) { _lvHazDrop(i); continue; }
    }

    if (!s) continue;

    // le convoi ne fait pas de quartier : il broie aussi les ennemis.
    // Cadencé à 8 Hz : la casse reste spectaculaire sans noyer l'écran.
    r.life -= dt;
    if (r.life <= 0 && inView(r.x, r.y, 260)) {
      r.life = 0.125;
      var rad = (r.w2 > r.h2 ? r.w2 : r.h2) + 18;
      var list = _lvCollect(r.x, r.y, rad);
      for (var k = 0; k < list.length; k++) {
        var e = list[k];
        if (e.dead) continue;
        var qx = clamp(e.x, r.x - r.w2, r.x + r.w2);
        var qy = clamp(e.y, r.y - r.h2, r.y + r.h2);
        var er = e.r + 2;
        if (dist2(e.x, e.y, qx, qy) < er * er) {
          _lvHitOpt.x = qx; _lvHitOpt.y = qy;
          damageEnemy(e, 9 + _lvCycle * 2, _lvHitOpt);
          if (S2030.fx) S2030.fx.burst(qx, qy, _lvPal.warm, 3, 190, { life: 0.2, size: 1.6 });
        }
      }
    }

    // collision avec la tête du serpent
    var cx = clamp(s.x, r.x - r.w2, r.x + r.w2);
    var cy = clamp(s.y, r.y - r.h2, r.y + r.h2);
    var hr = K.HEAD_R * 0.92;
    if (dist2(s.x, s.y, cx, cy) < hr * hr) {
      if (s.invuln <= 0) {
        hurtSnake(1, cx, cy);
        if (S2030.fx) {
          S2030.fx.ring(cx, cy, _lvPal.danger, 10, 640, { w: 5, life: 0.5 });
          S2030.fx.shake(12);
        }
      }
      // éjection minimale hors du gabarit : jamais deux coups d'affilée
      var px = s.x < r.x ? (r.x - r.w2 - hr - 2) - s.x : (r.x + r.w2 + hr + 2) - s.x;
      var py = s.y < r.y ? (r.y - r.h2 - hr - 2) - s.y : (r.y + r.h2 + hr + 2) - s.y;
      if (Math.abs(px) < Math.abs(py)) s.x += clamp(px, -60, 60);
      else s.y += clamp(py, -60, 60);
      s.x = clamp(s.x, K.HEAD_R, K.ARENA_W - K.HEAD_R);
      s.y = clamp(s.y, K.HEAD_R, K.ARENA_H - K.HEAD_R);
    }

    // pulsation rouge quand un convoi arrive vraiment sur nous
    var ahead = (r.x - s.x) * r.vx + (r.y - s.y) * r.vy;
    if (ahead < 0) {
      var dd = dist2(r.x, r.y, s.x, s.y);
      if (dd < 400 * 400) {
        var g = 1 - Math.sqrt(dd) / 400;
        if (g > _lvDanger) _lvDanger = g;
      }
    }
  }
}

/* ======
   MÉCANIQUE 3 — CHAMPS MAGNÉTIQUES
   ====== */

function _lvBuildNodes() {
  var d = _lvDef;
  if (!d.nodes) return;
  var n = d.nodes + ((_lvCycle / 2) | 0);
  if (n > 9) n = 9;
  for (var i = 0; i < n; i++) _lvAddNode(i & 1 ? -1 : 1);
}

function _lvAddNode(pull) {
  var d = _lvDef;
  var h = _lvHazGet(pull > 0 ? 'pull' : 'push');
  h.r = rndR(d.nodeR[0], d.nodeR[1]) * (1 + _lvCycle * 0.03);
  h.r2 = h.r * h.r;
  h.pull = pull;
  h.str = rndR(0.8, 1.15);
  h.x = rndR(h.r * 0.6, K.ARENA_W - h.r * 0.6);
  h.y = rndR(h.r * 0.6, K.ARENA_H - h.r * 0.6);
  var a = rnd() * TAU;
  var sp = d.nodeDrift * rndR(0.6, 1.4);
  h.vx = Math.cos(a) * sp;
  h.vy = Math.sin(a) * sp;
  h.col = pull > 0 ? _lvPal.pull : _lvPal.push;
  _lvMag.push(h);
  return h;
}

/* Force au point (x,y), écrite dans _lvFFX / _lvFFY. Normalisée : la somme
   des contributions vaut au plus ~1 par noeud, décroissance quadratique. */
function _lvFieldAt(x, y) {
  _lvFFX = 0; _lvFFY = 0;
  for (var i = 0; i < _lvMag.length; i++) {
    var nd = _lvMag[i];
    var dx = nd.x - x, dy = nd.y - y;
    var d2 = dx * dx + dy * dy;
    if (d2 > nd.r2) continue;
    var d = Math.sqrt(d2);
    if (d < 6) d = 6;
    var f = 1 - d / nd.r;
    f = f * f * nd.pull * nd.str;
    _lvFFX += (dx / d) * f;
    _lvFFY += (dy / d) * f;
  }
}

function _lvNodes(dt) {
  if (!_lvMag.length) return;
  var s = S.snake, i;
  var wob = _lvDef.back.overload ? 1.5 : 1;

  for (i = 0; i < _lvMag.length; i++) {
    var nd = _lvMag[i];
    nd.x += nd.vx * dt * wob;
    nd.y += nd.vy * dt * wob;
    var m = nd.r * 0.45;
    if (nd.x < m) { nd.x = m; nd.vx = -nd.vx; }
    if (nd.x > K.ARENA_W - m) { nd.x = K.ARENA_W - m; nd.vx = -nd.vx; }
    if (nd.y < m) { nd.y = m; nd.vy = -nd.vy; }
    if (nd.y > K.ARENA_H - m) { nd.y = K.ARENA_H - m; nd.vy = -nd.vy; }

    if (!s) continue;
    // coeur brûlant de l'attracteur : la seule partie qui blesse
    if (nd.pull > 0) {
      var cr = nd.r * 0.15 + K.HEAD_R;
      if (dist2(s.x, s.y, nd.x, nd.y) < cr * cr) {
        if (s.invuln <= 0) {
          hurtSnake(1, nd.x, nd.y);
          if (S2030.fx) S2030.fx.ring(nd.x, nd.y, _lvPal.danger, 12, 620, { w: 5, life: 0.5 });
        }
        var a = angTo(nd.x, nd.y, s.x, s.y);
        s.ang = norm(a);
      } else {
        var dd = dist2(s.x, s.y, nd.x, nd.y);
        var warnR = nd.r * 0.4;
        if (dd < warnR * warnR) {
          var g = 1 - Math.sqrt(dd) / warnR;
          if (g > _lvDanger) _lvDanger = g;
        }
      }
    }
  }
}

/* Applique le champ : cap du serpent, courbure des projectiles, dérive des
   ennemis. Un seul passage, sans allocation. */
function _lvFieldApply(dt) {
  if (!_lvMag.length) return;
  var s = S.snake, i, b, sp, ns, mag;

  // --- serpent : on courbe le cap, jamais la position ---
  if (s) {
    _lvFieldAt(s.x, s.y);
    if (_lvFFX || _lvFFY) {
      mag = Math.sqrt(_lvFFX * _lvFFX + _lvFFY * _lvFFY);
      if (mag > 1) mag = 1;
      var want = Math.atan2(_lvFFY, _lvFFX);
      var diff = norm(want - s.ang);
      var rate = _lvDef.fieldTurn * (1 + _lvCycle * 0.06) * mag;
      s.ang = norm(s.ang + clamp(diff, -rate * dt, rate * dt));
    }
  }

  // --- projectiles joueur : trajectoire courbée, vitesse conservée ---
  var accP = 1150;
  for (i = 0; i < S.bullets.length; i++) {
    b = S.bullets[i];
    _lvFieldAt(b.x, b.y);
    if (!_lvFFX && !_lvFFY) continue;
    sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp < 1) continue;
    b.vx += _lvFFX * accP * dt;
    b.vy += _lvFFY * accP * dt;
    ns = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (ns > 1) { b.vx = b.vx / ns * sp; b.vy = b.vy / ns * sp; }
  }

  // --- projectiles ennemis : idem, un peu moins sensibles ---
  var accE = 820;
  for (i = 0; i < S.ebullets.length; i++) {
    b = S.ebullets[i];
    _lvFieldAt(b.x, b.y);
    if (!_lvFFX && !_lvFFY) continue;
    sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp < 1) continue;
    b.vx += _lvFFX * accE * dt;
    b.vy += _lvFFY * accE * dt;
    ns = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (ns > 1) { b.vx = b.vx / ns * sp; b.vy = b.vy / ns * sp; }
  }

  // --- ennemis : simple dérive, ils luttent contre le champ ---
  if (S.enemies.length < 110) {
    var drift = 62;
    for (i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.dead) continue;
      _lvFieldAt(e.x, e.y);
      if (!_lvFFX && !_lvFFY) continue;
      e.x += _lvFFX * drift * dt;
      e.y += _lvFFY * drift * dt;
    }
  }
}

/* ======
   PARTICULES DE DÉCOR (poussière, limaille, traits de vitesse)
   ====== */

function _lvBuildDust() {
  if (!_lvDust) {
    _lvDust = new Array(150);
    for (var i = 0; i < _lvDust.length; i++) _lvDust[i] = { x: 0, y: 0, s: 1, p: 0 };
  }
  for (var j = 0; j < _lvDust.length; j++) {
    var d = _lvDust[j];
    d.x = rndR(0, K.ARENA_W);
    d.y = rndR(0, K.ARENA_H);
    d.s = rndR(1, 2.8);
    d.p = rnd() * TAU;
  }
}

function _lvBuildMotes() {
  if (!_lvMote) {
    _lvMote = new Array(56);
    for (var i = 0; i < _lvMote.length; i++) _lvMote[i] = { x: 0, y: 0, vx: 0, vy: 0, l: 0, c: 0 };
  }
  for (var j = 0; j < _lvMote.length; j++) { _lvMote[j].l = 0; }
}

function _lvMotes(dt) {
  if (!_lvMag.length || !_lvMote) return;
  var hw = S.view.w * 0.5 + 60, hh = S.view.h * 0.5 + 60;
  for (var i = 0; i < _lvMote.length; i++) {
    var m = _lvMote[i];
    m.l -= dt;
    if (m.l <= 0 || m.x < S.cam.x - hw || m.x > S.cam.x + hw || m.y < S.cam.y - hh || m.y > S.cam.y + hh) {
      m.x = S.cam.x + rndR(-hw, hw);
      m.y = S.cam.y + rndR(-hh, hh);
      m.vx = rndR(-24, 24); m.vy = rndR(-24, 24);
      m.l = rndR(1.1, 3.0);
      continue;
    }
    _lvFieldAt(m.x, m.y);
    m.c = _lvFFX * _lvFFX + _lvFFY * _lvFFY;
    m.vx = (m.vx + _lvFFX * 900 * dt) * 0.94;
    m.vy = (m.vy + _lvFFY * 900 * dt) * 0.94;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
  }
}

function _lvBuildStreaks() {
  if (!_lvStreak) {
    _lvStreak = new Array(26);
    for (var i = 0; i < _lvStreak.length; i++) _lvStreak[i] = { x: 0, y: 0, v: 0, len: 0, ax: 0, l: 0 };
  }
  for (var j = 0; j < _lvStreak.length; j++) _lvStreak[j].l = 0;
}

function _lvStreaks(dt) {
  if (!_lvStreak || !_lvLanes.length) return;
  var hw = S.view.w * 0.5 + 120, hh = S.view.h * 0.5 + 120;
  for (var i = 0; i < _lvStreak.length; i++) {
    var t = _lvStreak[i];
    t.l -= dt;
    if (t.l <= 0) {
      var ln = _lvLanes[rndI(0, _lvLanes.length - 1)];
      t.ax = ln.ax;
      t.v = ln.dir * ln.spd * rndR(1.4, 2.6);
      t.len = rndR(50, 190);
      t.l = rndR(0.5, 1.4);
      var sg = t.v < 0 ? -1 : 1;
      if (ln.ax === 0) {
        t.x = S.cam.x - sg * hw;
        t.y = ln.pos + rndR(-ln.h * 0.42, ln.h * 0.42);
      } else {
        t.y = S.cam.y - sg * hh;
        t.x = ln.pos + rndR(-ln.h * 0.42, ln.h * 0.42);
      }
      continue;
    }
    if (t.ax === 0) t.x += t.v * dt; else t.y += t.v * dt;
  }
}

/* ======
   DÉMARRAGE D'UN NIVEAU
   ====== */

function _lvStart(n) {
  n = n || 1;
  _lvN = n;
  S.level = n;
  S.levelT = 0;
  S.levelProgress = 0;
  S.boss = null;
  S.bossHpMax = 0;

  if (n <= 3) {
    _lvDef = _lvDefs[n - 1];
    _lvCycle = 0;
    _lvPal = _lvDef.palette;
  } else {
    _lvDef = _lvDefs[3];
    _lvCycle = n - 3;
    _lvPal = _LV_OVERPAL[(_lvCycle - 1) % _LV_OVERPAL.length];
  }

  _lvHazClear();
  _lvPendClear();
  _lvElites.length = 0;
  _lvBoss = null;
  _lvDanger = 0;
  _lvRigT = rndR(0.3, 1.2);
  _lvRingA = rnd() * TAU;

  _lvWaveT.length = _lvDef.spawns.length;
  // le préavis du portail est pris SUR L'AVANCE, pas ajouté au calendrier :
  // la salve s'annonce 600 ms plus tôt et l'ennemi arrive à l'heure prévue
  for (var i = 0; i < _lvWaveT.length; i++) _lvWaveT[i] = Math.max(0.02, rndR(0.3, 2.2) - _LV_PORTAL / 1000);

  _lvTotalDur = 0;
  for (var p = 0; p < _LV_PHASES.length; p++) _lvTotalDur += _lvDef.dur[_LV_PHASES[p]] || 10;

  _lvBuildLanes();
  _lvBuildNodes();
  _lvBuildDust();
  _lvBuildMotes();
  _lvBuildStreaks();

  // caches de dessin : la palette a changé
  _lvBloomG.length = 0;
  _lvBloomP.length = 0;
  _lvVigG = null; _lvVigKey = '';
  _lvDngG = null; _lvDngKey = '';
  for (var b = 0; b < 5; b++) {
    _lvBloomP.push({
      x: K.ARENA_W * (0.12 + 0.19 * b),
      y: K.ARENA_H * (b & 1 ? 0.24 : 0.76),
      r: rndR(340, 640),
      ph: rnd() * TAU
    });
  }

  _lvIntens = 0.12;
  S.intensity = _lvIntens;
  S.levelName = _lvDef.name;
  S.levelPhase = 'calm';
  _lvEnterPhase(0);

  if (S.phase === 'play') {
    _lvSay(_lvCycle > 0 ? (_lvDef.name + ' ' + _lvCycle) : ('NIVEAU ' + n + ' — ' + _lvDef.name));
    _lvHint(_lvDef.name, _lvDef.hint);
    if (S2030.fx) { S2030.fx.flash(_lvPal.accent, 0.26); S2030.fx.glitch(0.5); }
    if (S2030.audio) S2030.audio.sfx('warp');
  }
}

/* ======
   MISE À JOUR
   ====== */

function _lvUpdate(dt) {
  if (!_lvDef) _lvStart(S.level || 1);
  if (dt > 0.05) dt = 0.05;

  _lvRingA += dt * 0.55;
  _lvDanger *= Math.pow(0.02, dt);   // décroissance rapide, réarmée par les dangers

  _lvPhaseTick(dt);
  _lvPortalTick();
  _lvWaves(dt);
  _lvRigs(dt);
  _lvNodes(dt);
  _lvFieldApply(dt);
  _lvMotes(dt);
  _lvStreaks(dt);
  _lvIntensity(dt);
}

/* ======
   DESSIN — FOND
   ====== */

function _lvViewRect() {
  _lvVX = S.cam.x - S.view.w * 0.5 - 60;
  _lvVY = S.cam.y - S.view.h * 0.5 - 60;
  _lvVW = S.view.w + 120;
  _lvVH = S.view.h + 120;
}
var _lvVX = 0, _lvVY = 0, _lvVW = 0, _lvVH = 0;

function _lvDrawBlooms(ctx) {
  for (var i = 0; i < _lvBloomP.length; i++) {
    var p = _lvBloomP[i];
    if (!inView(p.x, p.y, p.r)) continue;
    var g = _lvBloomG[i];
    if (!g) {
      g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, _lvRgba(_lvPal.bloom, 0.55));
      g.addColorStop(0.55, _lvRgba(_lvPal.bloom, 0.16));
      g.addColorStop(1, _lvRgba(_lvPal.bloom, 0));
      _lvBloomG[i] = g;
    }
    ctx.globalAlpha = 0.5 + Math.sin(S.t * 0.0004 + p.ph) * 0.22 + _lvIntens * 0.2;
    ctx.fillStyle = g;
    ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  ctx.globalAlpha = 1;
}

function _lvDrawDust(ctx) {
  if (!_lvDust) return;
  // parallaxe : la poussière glisse par rapport au monde, ça creuse la profondeur
  var ox = S.cam.x * 0.10, oy = S.cam.y * 0.10;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = _lvPal.dust || _lvPal.accent;
  ctx.globalAlpha = 0.30 + _lvIntens * 0.18;
  ctx.beginPath();
  for (var i = 0; i < _lvDust.length; i++) {
    var d = _lvDust[i];
    var x = d.x + ox, y = d.y + oy;
    if (!inView(x, y, 20)) continue;
    var s = d.s * (0.7 + 0.3 * Math.sin(S.t * 0.002 + d.p));
    ctx.rect(x, y, s, s);
  }
  ctx.fill();
  ctx.restore();
}

function _lvDrawGrid(ctx) {
  var cell = _lvDef.back.cell;
  var x0 = Math.floor(_lvVX / cell) * cell;
  var y0 = Math.floor(_lvVY / cell) * cell;
  var x1 = _lvVX + _lvVW, y1 = _lvVY + _lvVH;
  var x, y;

  // trame fine : un seul tracé, un seul stroke
  ctx.lineWidth = 1;
  ctx.strokeStyle = _lvPal.grid;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (x = x0; x < x1; x += cell) { ctx.moveTo(x, _lvVY); ctx.lineTo(x, y1); }
  for (y = y0; y < y1; y += cell) { ctx.moveTo(_lvVX, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  // trame forte : une ligne sur quatre
  var big = cell * 4;
  ctx.lineWidth = 2;
  ctx.strokeStyle = _lvPal.gridHot;
  ctx.globalAlpha = 0.20 + _lvIntens * 0.16;

  _lvOverlay(ctx, _lvPal.bloom, f.fog + _lvIntens * 0.05, 0.30, false);

  // vignette de danger : pulsation rouge quand ça se joue à rien
  var s = S.snake;
  var dng = _lvDanger;
  if (s && s.len <= 3) dng = Math.max(dng, 0.5 + Math.sin(S.t * 0.008) * 0.3);
  if (_lvBoss && !_lvBoss.dead) dng = Math.max(dng, 0.16);
  if (dng > 0.02) {
    var pulse = 0.7 + Math.sin(S.t * 0.014) * 0.3;
    _lvOverlay(ctx, _lvPal.danger, Math.min(0.5, dng * 0.5 * pulse), 0.34, true);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

}
function _uiTxt(el, s) { if (el._uv !== s) { el._uv = s; el.textContent = s; } }
function _uiBar(el, v) {

/* activation tactile : on court-circuite les écouteurs du coeur posés sur #app */
function _uiTap(el, fn) {
  var busy = false;
  function fire(e) {
    if (busy) return;
    busy = true;
    setTimeout(function () { busy = false; }, 220);
    if (e) { e.stopPropagation(); if (e.cancelable) e.preventDefault(); }
    _uiClick();
    fn(el);
  }
  if (window.PointerEvent) {
    el.addEventListener('pointerdown', fire, { passive: false });
    el.addEventListener('touchstart', function (e) { e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive: false });
  } else {
    el.addEventListener('touchstart', fire, { passive: false });
    el.addEventListener('mousedown', fire, { passive: false });
  }
  el.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
  el.addEventListener('touchend', function (e) { e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive: false });
  // clavier : Entrée ou Espace sur l'élément focalisé, même verrou busy. Le verrou de l'écran de fin
  // vaut aussi ici : l'événement atteint le bouton focalisé AVANT le gestionnaire d'écran, donc sans
  // ce garde une touche encore enfoncée à la mort relancerait la partie avant les 600 ms.
  el.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (!(e.key === 'Enter' || e.key === ' ' || e.code === 'Space')) return;
    if (_uiScreen === 'over' && _uiOverLock) return;
    fire(e);
  });

  return el;
}

/* laisse défiler un panneau sans que le coeur n'avale le geste */
function _uiScrollable(el) {
  el.addEventListener('touchstart', function (e) { e.stopPropagation(); }, { passive: true });
  el.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
  el.addEventListener('touchend', function (e) { e.stopPropagation(); }, { passive: true });
}

/* ------ formatage -- */
function _uiNum(n) {
  n = Math.round(n) || 0;
  if (n < 1000) return '' + n;
  var s = '' + n, out = '', c = 0;
  for (var i = s.length - 1; i >= 0; i--) {

    if (++c % 3 === 0 && i > 0) out = ' ' + out;

  return out;
}
function _uiTime(ms) {
  var t = Math.max(0, ms / 1000) | 0;
  var m = (t / 60) | 0, s = t % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ======
   SNAKE 2030 — amorçage
   Canvas, entrées tactiles, rendu du serpent, boucle principale, cycle de vie.
   ====== */

var cv, ctx, DPR = 1, CW = 0, CH = 0, SCALE = 1, _pxApplied = 1.5, _pxVoulu = 1.5;
var _fsbSync = null, _fsHelp = null;

/* ------ quarantaine des erreurs
   Une exception dans une étape de frame() n'emporte plus l'image : chaque
   étape est isolée, l'entité fautive est marquée dead et retirée (aussitôt
   si c'est son update qui lève, à l'image suivante si c'est son dessin), et
   l'erreur est journalisée une fois par signature — message plus première
   ligne de pile — dans window.__ERR = { count, sigs }. */
var ERR = { count: 0, sigs: {} };

function errSig(e) {
  var msg = (e && e.message != null) ? String(e.message) : String(e);
  var line = '';
  var st = (e && e.stack) ? String(e.stack).split('\n') : [];
  for (var i = 0; i < st.length; i++) {
    var l = st[i].trim();
    if (!l) continue;
    // V8 répète le message en tête de pile ; on veut la première vraie ligne
    if (i === 0 && l.indexOf('@') < 0 && l.indexOf('at ') !== 0 && l.indexOf(msg) >= 0) continue;
    line = l; break;
  }
  return msg + (line ? ' @ ' + line : '');
}

function errLog(where, e) {
  ERR.count++;
  var sig = where + ' | ' + errSig(e);
  if (ERR.sigs[sig]) { ERR.sigs[sig]++; return; }
  ERR.sigs[sig] = 1;
  try { console.warn('SNAKE 2030 — erreur mise en quarantaine : ' + sig); } catch (x) { /* rien */ }
}

/* Repère monde de l'image en cours, gardé pour le rétablir après une
   exception survenue au milieu d'un save() : on déroule toute la pile, on
   remet les attributs à leur défaut et on repose la caméra. */
var _WX = { bw: 0, bh: 0, rt: 0, sx: 1, sy: 1, ox: 0, oy: 0 };

function worldXf(g, W) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.translate(W.bw / 2, W.bh / 2);
  if (W.rt) g.rotate(W.rt);
  g.scale(W.sx, W.sy);
  g.translate(-S.cam.x + W.ox, -S.cam.y + W.oy);
}

function gfxRecover(g, W) {
  try {
    for (var k = 0; k < 32; k++) g.restore();   // au-delà de la pile : sans effet
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.shadowBlur = 0; g.shadowColor = 'rgba(0,0,0,0)';

function setupCanvas() {
  cv = document.getElementById('game');
  ctx = cv.getContext('2d', { alpha: false });
  resizeCanvas();
}

/* Plafond de densité de pixels. Mesuré sur une partie réelle : à 2, neuf pour
   cent des images dépassent 33 ms et la lecture saccade ; à 1,5, aucune, et
   l'affichage reste verrouillé à soixante images par seconde. Le coût est
   entièrement en remplissage — le profil ne montrait plus une seule fonction
   JavaScript significative. Un halo néon supporte très bien 1,5 ; une image
   sur dix perdue, non. Le joueur peut remonter le curseur s'il veut. */
function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, S.pxEff || S.opt.px || 1.5);
  var w = window.innerWidth, h = window.innerHeight;
  CW = w; CH = h;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  _perspApplied = -1;                      // la distance d'oeil dépend de la hauteur
  /* Hauteur de vue de référence en unités monde, puis la largeur est bornée :
     jamais moins de 1000 unités (fenêtre haute et étroite : on dézoome au
     lieu de couper) ni plus de 1600 (écran ultra-large : on ne voit pas toute
     l'arène). La hauteur suit — ce n'est plus une constante. */
  SCALE = h / K.VIEW_H;
  if (w / SCALE < 1000) SCALE = w / 1000;
  if (w / SCALE > 1600) SCALE = w / 1600;
  S.view.h = h / SCALE;
  S.view.w = w / SCALE;

  var portrait = !S.desktop && h > w;

     partie continuait derrière, le joueur encaissant des coups qu'il ne
     pouvait ni voir ni éviter. On met en pause comme pour l'arrière-plan. */
  if (portrait && S.phase === 'play' && !S.paused) togglePause();

/* ------ entrées tactiles */
var touchJoy = null;     // { id, ox, oy, x, y }
var touchBtns = {};      // id -> nom de bouton

/* L'interface possède la géométrie des contrôles : elle applique les réglages
   du joueur (position, taille, main gauche). Le coeur ne la duplique pas, il
   l'interroge — sinon la zone tactile et le dessin finissent par diverger et
   le joueur tape à côté. */
function hitBtn(x, y) {
  return (S2030.ui && S2030.ui.hitTest) ? S2030.ui.hitTest(x, y) : null;
}

function joySide(x) {
  var home = (S2030.ui && S2030.ui.joyHome) ? S2030.ui.joyHome() : null;
  if (home) return Math.abs(x - home.x) < CW * 0.5;
  return S.opt.leftHanded ? x > CW * 0.5 : x < CW * 0.5;

function onTouchStart(e) {

    var t = e.changedTouches[i];
    var b = hitBtn(t.clientX, t.clientY);
    if (b) { touchBtns[t.identifier] = b; S.input[b] = true; pressBtn(b); continue; }
    // bande du haut réservée au HUD : le manche flottant s'y dessinait par-dessus
    if (t.clientY < CH * 0.22) continue;
    if (!touchJoy && joySide(t.clientX)) {
      touchJoy = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
      S.input.jactive = true;
      S2030.ui && S2030.ui.placeJoy && S2030.ui.placeJoy(t.clientX, t.clientY);
    }

  if (e.cancelable) e.preventDefault();

  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (touchJoy && t.identifier === touchJoy.id) {
      touchJoy.x = t.clientX; touchJoy.y = t.clientY;
      var dx = touchJoy.x - touchJoy.ox, dy = touchJoy.y - touchJoy.oy;
      var mag = Math.hypot(dx, dy);
      var max = 64 * S.opt.joySize;
      if (S.opt.joyFloat && mag > max) {
        // manche flottant : l'origine se laisse entraîner, on ne bute jamais
        var k = (mag - max) / mag;
        touchJoy.ox += dx * k; touchJoy.oy += dy * k;
        dx = touchJoy.x - touchJoy.ox; dy = touchJoy.y - touchJoy.oy; mag = max;
        S2030.ui && S2030.ui.placeJoy && S2030.ui.placeJoy(touchJoy.ox, touchJoy.oy);
      }
      S.input.jmag = clamp(mag / max, 0, 1);
      if (mag > 0.001) { S.input.jx = dx / mag; S.input.jy = dy / mag; }
    }

  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (touchJoy && t.identifier === touchJoy.id) {

      S2030.ui && S2030.ui.releaseJoy && S2030.ui.releaseJoy();
    }

    if (b) { S.input[b] = false; delete touchBtns[t.identifier]; }
  }
  if (e.cancelable) e.preventDefault();
}

  if (b === 'special') useSpecial();
  if (b === 'ult') useUlt();
}

/* --- clavier : pilotage complet sur ordinateur ---
   Directions lues sur e.code, la position physique de la touche : ZQSD et

var keys = {};
var KEY_ONCE = { e: 1, r: 1, f: 1, p: 1, escape: 1, enter: 1 };

addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // un écran affiché (menu, cartes, pause, fin, réglages) a la priorité sur les touches de jeu
  if (S2030.ui && S2030.ui.key && S2030.ui.key(e)) return;
  var k = keyName(e), code = e.code || '';

  if (!e.repeat && DIR_KEYS[code]) { mouse.on = false; mouse.acc = 0; }   // 'auto' : la souris rend la main
  var space = code === 'Space' || e.key === ' ';

  if (space) {
    if (S.paused) { if (!e.repeat) togglePause(); return; }
    S.input.boost = true;
    return;
  }

  else if (k === 'r') useUlt();
  else if (k === 'p' || k === 'escape') togglePause();

}, true);
addEventListener('keyup', function (e) {

  var ky = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.KeyZ || keys.ArrowUp ? 1 : 0);

/* --- souris (bureau). S.opt.mouse 'auto' : active après 8 px cumulés, rendue à la première touche de
   direction. Gauche = boost, droit = spécial, molette ou central = ultime. */
var mouse = { x: 0, y: 0, has: false, on: false, acc: 0, lb: false, moveAt: -1e9, cur: '', aim: null };
var _kdir = false, _mh = { sx: 0, sy: 0 };
var DIR_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, KeyZ: 1, KeyQ: 1 };
function mouseActive() {
  var m = S.opt.mouse || 'auto';
  return !!S.desktop && mouse.has && m !== 'never' && (m === 'always' || mouse.on);
}
function inPlay() { return S.phase === 'play' && !S.paused; }
function onMouseMove(e) {
  if (!S.desktop) return;
  if (mouse.has && !mouse.on) { mouse.acc += Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y); if (mouse.acc >= 8) mouse.on = true; }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.has = true; mouse.moveAt = performance.now();

}
function onMouseDown(e) {
  if (!S.desktop || (e.target && e.target.tagName === 'BUTTON')) return;   // le bouton pause n'est pas un boost
  if (e.button === 0) { mouse.lb = true; if (inPlay()) S.input.boost = true; }
  else if (e.button === 1) { e.preventDefault(); if (inPlay()) useUlt(); }
}
function onMouseUp(e) {
  if (!S.desktop || e.button !== 0) return;
  mouse.lb = false; S.input.boost = false;
}
function onWheel(e) {

  e.preventDefault();

}

}
/* souris → S.input (avant updateSnake) : au-delà de 24 px, cap = atan2 − roulis, jmag = |d|/120 dans [0,25 ; 1] ;
   touche de direction tenue : les touches dirigent, la souris vise (mouse.aim) */
function mouseInput() {
  mouse.aim = null;
  if (!S.snake || !mouseActive()) return;
  var P = S2030.phases, s = S.snake, h = P.worldToScreen(s.x, s.y, _mh);
  var dx = mouse.x - h.sx, dy = mouse.y - h.sy, L = Math.hypot(dx, dy), inp = S.input;
  if (L > 24) {
    var cap = Math.atan2(dy, dx) - P.rot();
    if (_kdir) mouse.aim = cap;
    else { inp.jx = Math.cos(cap); inp.jy = Math.sin(cap); inp.jmag = clamp(L / 120, 0.25, 1); inp.jactive = true; }

/* visée souris, après updateSnake et avant les armes */
function mouseAim() {

  var s = S.snake;
  s.aim = norm(s.ang + clamp(norm(mouse.aim - s.ang), -RAIL_LOOK, RAIL_LOOK));

/* curseur : réticule en jeu, masqué après 1,5 s sans mouvement */
function mouseCursor(now) {
  var want = (S.desktop && inPlay()) ? (now - mouse.moveAt > 1500 ? 'none' : 'ret') : '';
  if (want === mouse.cur) return;
  mouse.cur = want;
  S2030.ui && S2030.ui.cursor && S2030.ui.cursor(want);
}

/* ------ capacités */
function useSpecial() {
  if (S2030.phases) { S2030.phases.use(); return; }
  if (S.phase !== 'play' || S.specialCd > 0) return;
  S.specialCd = S.specialCdMax || 7000;
  var s = S.snake;
  // TRANSE : la traversée dure plus longtemps
  var gt = 2200 + 700 * (S.up.f_ghostTime || 0);
  s.ghost = gt;
  s.invuln = Math.max(s.invuln, gt);
  S2030.fx && S2030.fx.ring(s.x, s.y, '#b388ff', 10, 900);
  S2030.fx && S2030.fx.flare(s.x, s.y, '#b388ff', 160);
  S2030.audio && S2030.audio.sfx('shock');
  var near = enemiesNear(s.x, s.y, 240);
  for (var i = 0; i < near.length; i++) {
    var e = near[i];
    var a = angTo(s.x, s.y, e.x, e.y);
    e.vx += Math.cos(a) * 420; e.vy += Math.sin(a) * 420;
    damageEnemy(e, 6, { x: e.x, y: e.y });
  }
  haptic(24);
}

function useUlt() {
  if (S.phase !== 'play' || S.ult < S.ultMax) return;
  S.ult = 0;
  S.timeScale = 0.25;
  S2030.audio && S2030.audio.ultimate();
  /* Un flash à 0,85 mangeait l'écran une demi-seconde et la bannière cachait
     le déferlement : 0,4 pendant 120 ms, et on regarde le jeu. */
  S2030.fx && S2030.fx.flash('#ffffff', 0.4, null, null, 120);
  S2030.fx && S2030.fx.shake(18);
  haptic([40, 20, 90]);
  // minuteries en temps de jeu (S.t, contrat : jamais l'horloge murale) : le
  // ralenti et le déferlement durent le même nombre d'images d'une machine à
  // l'autre, et s'arrêtent avec la pause
  _ultEnd = S.t + 420;
  _ultStep = 0; _ultNext = S.t + 90;   // premier palier à 90 ms, comme l'ancien setInterval
}

/* Déferlement de l'ultime : vague de destruction concentrique, six paliers à

   jeu par frame(). */
var _ultEnd = -1, _ultStep = 9, _ultNext = 0;

  if (_ultEnd >= 0 && S.t >= _ultEnd) { _ultEnd = -1; S.timeScale = 1; }
  if (_ultStep > 5) return;
  if (S.phase !== 'play') { _ultStep = 9; return; }
  while (_ultStep <= 5 && S.t >= _ultNext) {
    var s = S.snake, r = 160 + _ultStep * 150;
    S2030.fx && S2030.fx.ring(s.x, s.y, '#fff3b0', r * 0.5, 1400);
    var list = enemiesNear(s.x, s.y, r);
    for (var i = 0; i < list.length; i++) damageEnemy(list[i], 40, { x: list[i].x, y: list[i].y });
    S2030.audio && S2030.audio.sfx('explode');
    _ultStep++; _ultNext += 90;
  }
}

/* ------ rendu du serpent */
function drawSnake() {
  var s = S.snake, segs = s.segs, n = segs.length;
  var blink = s.invuln > 0 && ((S.t / 60) | 0) % 2 === 0;
  var ghost = s.ghost > 0;

  var body = ghost ? '#b388ff' : '#00e5ff';
  var edge = ghost ? '#5b2fa8' : '#0077a8';
  if (blink) body = '#ffffff';

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // traînée de boost
  if (s.boosting) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,214,102,.45)';
    ctx.lineWidth = S.headR * 2.4;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    for (var t = 0; t < Math.min(n, 10); t++) ctx.lineTo(segs[t].x, segs[t].y);
    ctx.stroke();
    ctx.restore();
  }

  // corps : contour puis remplissage
  for (var pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass === 0 ? edge : body;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    for (var i = 0; i < n; i++) {
      if (!inView(segs[i].x, segs[i].y, 120) && i > 2) { ctx.moveTo(segs[i].x, segs[i].y); continue; }
      ctx.lineTo(segs[i].x, segs[i].y);
    }
    ctx.lineWidth = S.headR * (pass === 0 ? 1.9 : 1.5);
    ctx.stroke();
  }

  // écailles lumineuses tous les trois segments
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = ghost ? 'rgba(179,136,255,.5)' : 'rgba(120,255,255,.45)';
  for (var k = 2; k < n; k += 3) {
    if (!inView(segs[k].x, segs[k].y, 40)) continue;
    ctx.beginPath(); ctx.arc(segs[k].x, segs[k].y, S.headR * 0.32, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // modules d'armes visibles
  S2030.weapons && S2030.weapons.drawMounts && S2030.weapons.drawMounts(ctx);

  // tête : halo permanent, elle doit rester repérable en toutes circonstances
  ctx.save();
  ctx.translate(s.x, s.y);
  // la tête suit la visée, pas la trajectoire : sur le treillis elle pivote
  // vers sa cible pendant que le corps reste sur son rail
  ctx.rotate(aimAng());
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(0, 0, 2, 0, 0, K.HEAD_R * 3.2);
  g.addColorStop(0, ghost ? 'rgba(179,136,255,.85)' : 'rgba(0,229,255,.8)');
  g.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, K.HEAD_R * 3.2, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = blink ? '#ffffff' : (ghost ? '#d9c2ff' : '#9df5ff');
  ctx.strokeStyle = edge; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(K.HEAD_R * 1.55, 0);
  ctx.lineTo(-K.HEAD_R * 0.7, -K.HEAD_R * 1.05);
  ctx.lineTo(-K.HEAD_R * 0.25, 0);
  ctx.lineTo(-K.HEAD_R * 0.7, K.HEAD_R * 1.05);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#06131c';
  ctx.beginPath(); ctx.arc(K.HEAD_R * 0.35, -K.HEAD_R * 0.3, 2.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(K.HEAD_R * 0.35, K.HEAD_R * 0.3, 2.6, 0, TAU); ctx.fill();
  ctx.restore();

  drawBoostArc(s);
}

// jauge de boost autour de la tête : arc de 270°, rayon 2,2 × HEAD_R, 3 px d'écran, ambre (rouge sous 20 %)
function drawBoostArc(s) {
  var f = clamp(s.boostE / (s.boostMax || 100), 0, 1);
  if (f >= 1 && !s.boosting) return;
  var zm = 1;
  try { if (S2030.phases && S2030.phases.zoom) zm = S2030.phases.zoom(); } catch (x) { zm = 1; }
  var r = K.HEAD_R * 2.2, a0 = aimAng() - Math.PI * 0.75, span = Math.PI * 1.5;   // se remplit de l'arrière-gauche vers l'avant
  ctx.save();
  ctx.lineCap = 'butt'; ctx.lineWidth = 3 / (SCALE * zm); ctx.strokeStyle = f < 0.2 ? '#ff2a2a' : '#ffd166';
  ctx.globalAlpha = 0.28;                          // piste discrète sur les 270°, puis la part remplie
  ctx.beginPath(); ctx.arc(s.x, s.y, r, a0, a0 + span); ctx.stroke();
  if (f > 0.002) { ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(s.x, s.y, r, a0, a0 + span * f); ctx.stroke(); }
  ctx.restore();
}

function drawPickups() {
  for (var i = 0; i < S.pickups.length; i++) {
    var p = S.pickups[i];
    if (!inView(p.x, p.y, 40)) continue;
    var pulse = 1 + Math.sin(S.t / 180 + i) * 0.16;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var col = p.kind === 'core' ? '#ffd166' : (p.kind === 'heal' ? '#7CFFB2' : '#00e5ff');
    var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath();
    if (p.kind === 'core') {
      for (var k = 0; k < 6; k++) {
        var a = k * TAU / 6 + S.t / 700;
        var rr = k % 2 ? p.r * 0.5 : p.r * pulse;
        ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
      }
      ctx.closePath();
    } else {
      ctx.arc(p.x, p.y, p.r * pulse, 0, TAU);
    }
    ctx.fill();
    ctx.restore();
  }
}

function drawBullets() {
  var i, b;
  for (i = 0; i < S.bullets.length; i++) {
    b = S.bullets[i];
    if (!inView(b.x, b.y, 30)) continue;
    try {
      if (S2030.weapons && S2030.weapons.drawBullet) S2030.weapons.drawBullet(ctx, b);
      else { ctx.fillStyle = b.color || '#fff3b0'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); }
    } catch (x) { b.life = 0; errLog('bullet.draw:' + (b.kind || '?'), x); gfxRecover(ctx, _WX); }
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < S.ebullets.length; i++) {
    b = S.ebullets[i];
    if (!inView(b.x, b.y, 30)) continue;
    var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3);
    g.addColorStop(0, b.color || '#ff5c3a'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawArenaEdge() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,92,138,.5)';
  ctx.lineWidth = 4;
  ctx.setLineDash([26, 18]);
  ctx.lineDashOffset = -S.t / 30;
  ctx.strokeRect(0, 0, K.ARENA_W, K.ARENA_H);
  ctx.restore();
}

/* ------ boucle de jeu */
var lastT = 0, accFps = 0, accReal = 0, frames = 0, fps = 60;

function frame(now) {
  requestAnimationFrame(frame);
  var real = Math.min(0.05, (now - lastT) / 1000 || 0.016);   // temps d'image réel, s
  lastT = now;
  // pas de temps imposé par une sonde de test (window.__DT, en secondes) : la
  // latence « en images » mesurée sur le treillis ne dépend plus du taux
  // d'images réel de la machine de test, et la suite d'états du jeu devient
  // la même d'une exécution à l'autre ; jamais posé en jeu normal. La mesure
  // de qualité, elle, regarde toujours le temps d'image réel.
  var raw = window.__DT > 0 ? Math.min(0.05, +window.__DT) : real;

  frames++; accFps += raw; accReal += real;
  if (accFps > 0.5) { fps = frames / accReal; frames = 0; accFps = 0; accReal = 0; autoQuality(); }

  /* HITSTOP compté en IMAGES. On lit d'abord, on gèle, PUIS on consomme :
     une pose faite plus loin dans cette image (un kill, un coup reçu) ne peut
     donc pas être avalée par l'image qui la pose. C'est ce décalage qui
     manquait — fx.hitstop(12) ne gelait rien du tout. */
  var hs = S2030.fx && S2030.fx.hitstopLeft ? S2030.fx.hitstopLeft() : 0;
  var scale = hs > 0 ? 0.08 : S.timeScale;
  var dt = raw * scale;
  S.dt = dt;
  if (hs > 0 && S2030.fx.hitstopStep) S2030.fx.hitstopStep();

  // le réglage de netteté s'applique sans passer par un événement de mise en page
  try {
    qualitySample(real);
    qualityTilt();
    if (_fsbSync) _fsbSync();
    if (S.opt.px !== _pxVoulu) { _pxVoulu = S.opt.px; _qStep = 0; _qBon = 0; applyQuality(); }
    mouseCursor(now);
  } catch (e) { errLog('quality', e); }

  /* Chaque étape est isolée : une exception dans l'une ne prive pas les
     suivantes, et render() puis hud() tournent quoi qu'il arrive. */
  if (S.phase === 'play' && !S.paused) {
    S.t += raw * 1000;
    try { keyboardInput(); } catch (e) { errLog('keyboardInput', e); }
    try { mouseInput(); } catch (e) { errLog('mouseInput', e); }
    try { ultTick(); } catch (e) { errLog('ultTick', e); }
    try { updateSnake(dt); } catch (e) { errLog('updateSnake', e); }
    try { mouseAim(); } catch (e) { errLog('mouseAim', e); }
    S.levelT += dt;
    try { S2030.levels && S2030.levels.update && S2030.levels.update(dt); } catch (e) { errLog('levels.update', e); }
    updateEnemies(dt);                       // try/catch par ennemi
    try { S2030.weapons && S2030.weapons.update && S2030.weapons.update(dt); } catch (e) { errLog('weapons.update', e); }
    try { S2030.phases && S2030.phases.update(dt); } catch (e) { errLog('phases.update', e); }
    try { auraTick(dt); } catch (e) { errLog('auraTick', e); }
    try { sonicTick(dt); } catch (e) { errLog('sonicTick', e); }
    try { poolsTick(dt); } catch (e) { errLog('poolsTick', e); }
    try { collide(dt); } catch (e) { errLog('collide', e); }
    // dernier mot au treillis : plus rien ne déplacera les ennemis après
    try { S2030.phases && S2030.phases.railLate && S2030.phases.railLate(dt); } catch (e) { errLog('railLate', e); }
    if (S.multT > 0) { S.multT -= raw * 1000; if (S.multT <= 0) { S.mult = 1; S.combo = 0; } }
    if (S.specialCd > 0) S.specialCd -= raw * 1000;
    try { updateCam(dt); } catch (e) { errLog('updateCam', e); }
    try { S2030.audio && S2030.audio.setIntensity(S.intensity); } catch (e) { errLog('audio.setIntensity', e); }
    try { readyTick(); } catch (e) { errLog('readyTick', e); }
    if (S.lvlUps > 0) { try { openCards(); } catch (e) { errLog('openCards', e); } }
  } else if (S.phase === 'dead' || S.phase === 'cards') {
    S.t += raw * 1000;
    // la caméra continue de se redresser : sinon le récapitulatif se lit sur
    // une image penchée à 30° et gardée telle quelle
    try { S2030.phases && S2030.phases.settle && S2030.phases.settle(raw); } catch (e) { errLog('phases.settle', e); }
  } else if (S.phase === 'menu') {
    S.t += raw * 1000;
    S.cam.x = lerp(S.cam.x, K.ARENA_W / 2, 0.02);
    S.cam.y = lerp(S.cam.y, K.ARENA_H / 2, 0.02);
  } else {
    S.t += raw * 1000;
  }

  try { S2030.fx && S2030.fx.update(raw); } catch (e) { errLog('fx.update', e); }
  try { render(); } catch (e) { errLog('render', e); gfxRecover(ctx, null); }
  try { S2030.ui && S2030.ui.hud && S2030.ui.hud(); } catch (e) { errLog('hud', e); }
  syncControls();
}

function updateEnemies(dt) {
  var ts = 1;
  try { ts = S2030.phases ? S2030.phases.enemyTimeScale() : 1; } catch (x) { errLog('enemyTimeScale', x); }
  dt *= ts;
  var E = S2030.enemies;
  for (var i = S.enemies.length - 1; i >= 0; i--) {
    var e = S.enemies[i];
    if (e.dead) { S.enemies.splice(i, 1); continue; }
    e.t += dt * 1000;
    if (e.hitT > 0) e.hitT -= dt * 1000;
    if (!E || !E.update) continue;
    try { E.update(e, dt); }
    catch (x) { e.dead = true; e.qrt = 1; S.enemies.splice(i, 1); errLog('enemy.update:' + e.type, x); }
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, CW, CH);

  var P = S2030.phases;
  try { applyPersp((P && P.persp) ? P.persp() : 0); } catch (x) { errLog('applyPersp', x); }
  drawWorld(ctx, CW, CH);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  try { S2030.fx && S2030.fx.drawScreen && S2030.fx.drawScreen(ctx, CW, CH); }
  catch (x) { errLog('fx.drawScreen', x); gfxRecover(ctx, null); }
  drawControls();
}

/* Dessine le monde à plat dans le contexte donné, dont la surface fait
   bw x bh pixels CSS. Hors perspective c'est l'écran ; en perspective c'est
   un tampon plus grand, parce que la division perspective a besoin de
   matière hors cadre. */
function drawWorld(g, bw, bh) {
  /* Les aides de dessin de ce module écrivent dans le « ctx » global. Plutôt
     que de leur ajouter un paramètre — et d'en oublier une —, on échange le
     global le temps de la passe. Les modules qui reçoivent déjà un contexte
     en argument ne sont pas concernés. */
  var _prev = ctx;
  ctx = g;

  var sh = S2030.fx && S2030.fx.shakeAmount ? S2030.fx.shakeAmount() : 0;
  var ox = 0, oy = 0;
  if (sh > 0.2 && !S.opt.reduceShake) { ox = rndR(-sh, sh); oy = rndR(-sh, sh); }

  var P = S2030.phases;
  var zm = 1, tl = 0, rt = 0;
  try { if (P) { zm = P.zoom(); tl = P.tilt(); rt = P.rot(); } } catch (x) { errLog('phases.camera', x); }
  var sx2 = SCALE * zm, sy2 = SCALE * zm * (1 - tl * 0.42);
  // la vue change de taille avec le zoom et avec la cible : le tri du visible
  // doit suivre, sinon la perspective révèle les trous là où l'on a coupé
  S.view.w = bw / sx2; S.view.h = bh / sy2;
  _WX.bw = bw; _WX.bh = bh; _WX.rt = rt; _WX.sx = sx2; _WX.sy = sy2; _WX.ox = ox; _WX.oy = oy;
  g.save();
  worldXf(g, _WX);

  /* Chaque couche est isolée : si l'une lève au milieu d'un save(), on
     déroule la pile et on repose la caméra avant de passer à la suivante. */
  try {
    try { S2030.levels && S2030.levels.drawBack && S2030.levels.drawBack(g); } catch (x) { errLog('levels.drawBack', x); gfxRecover(g, _WX); }
    try { P && P.drawFloor(g); } catch (x) { errLog('phases.drawFloor', x); gfxRecover(g, _WX); }
    try { drawArenaEdge(); } catch (x) { errLog('drawArenaEdge', x); gfxRecover(g, _WX); }
    try { drawPools(g); } catch (x) { errLog('drawPools', x); gfxRecover(g, _WX); }
    try { drawPickups(); } catch (x) { errLog('drawPickups', x); gfxRecover(g, _WX); }

    var E = S2030.enemies;
    for (var i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.qrt || !inView(e.x, e.y, e.r + 60)) continue;
      if (!E || !E.draw) continue;
      try { E.draw(g, e); }
      catch (x) { e.dead = true; e.qrt = 1; errLog('enemy.draw:' + e.type, x); gfxRecover(g, _WX); }
    }

    try { drawBullets(); } catch (x) { errLog('drawBullets', x); gfxRecover(g, _WX); }
    try { if (S.snake) drawSnake(); } catch (x) { errLog('drawSnake', x); gfxRecover(g, _WX); }
    try { P && P.drawDiag(g); } catch (x) { errLog('phases.drawDiag', x); gfxRecover(g, _WX); }
    try { S2030.fx && S2030.fx.draw(g); } catch (x) { errLog('fx.draw', x); gfxRecover(g, _WX); }
    try { S2030.levels && S2030.levels.drawFore && S2030.levels.drawFore(g); } catch (x) { errLog('levels.drawFore', x); gfxRecover(g, _WX); }
  } finally {
    g.restore();
    ctx = _prev;
  }
}

/* ------ perspective
   Transformation CSS 3D posée sur le canvas : le rendu reste plat, seul l'affichage penche,
   sur le processeur graphique (la première version recopiait 96 bandes par image : 73 % du
   temps processeur et un escalier sur les diagonales). Le plan penché ne couvre plus l'écran,
   d'où l'agrandissement calculé ici et la compensation de zoom côté caméra. */
var PERSP_D = 4.6;          // distance de l'oeil, en demi-hauteurs d'écran
var _perspApplied = -1;

/* Agrandissement nécessaire pour que le plan penché couvre encore l'écran. */
function perspCover(t) {
  var c = Math.cos(t);
  if (c < 0.2) return 1;
  // 1,5 % de marge : sans elle un liseré de 4 px reste découvert en haut,
  // le calcul étant exact au pixel près et l'arrondi du navigateur non
  return (PERSP_D + Math.sin(t)) / (PERSP_D * c) * 1.015;
}

function applyPersp(t) {
  var q = Math.round(t * 400) / 400;          // on ne touche au style qu'utile
  if (q === _perspApplied) return;
  _perspApplied = q;
  if (!cv) return;
  if (q <= 0.0005) {
    cv.style.transform = '';
    cv.style.willChange = '';            // la couche promue ne doit pas survivre
    cv.style.backfaceVisibility = '';
    return;
  }
  var P = (CH * 0.5 * PERSP_D).toFixed(0);
  cv.style.transformOrigin = '50% 50%';
  cv.style.willChange = 'transform';
  cv.style.backfaceVisibility = 'hidden';
  cv.style.transform = 'perspective(' + P + 'px) rotateX(' + (q * 180 / Math.PI).toFixed(2) +
                       'deg) scale(' + perspCover(q).toFixed(4) + ')';
}

/* Les contrôles sont rendus par l'interface, en DOM : un seul dessin, une
   seule géométrie, donc zone tactile et visuel ne peuvent pas diverger. */
function drawControls() {}
function syncControls() {}

/* ------ qualité adaptative
   Trois défauts mesurés sur l'ancienne version : le seuil de 42 images/s ne se
   déclenchait jamais pendant la bascule 3D (le jeu y lit 48 à 54 im/s de
   moyenne tout en perdant une image sur six) ; la dégradation ne remontait
   jamais ; et elle écrasait le réglage du joueur dans son profil enregistré.
   On regarde donc la proportion d'images longues plutôt que la moyenne, on
   remonte dès que ça respire, et l'ajustement automatique reste en mémoire
   sans jamais toucher au choix du joueur. */
var _qWin = [], _qStep = 0, _qHold = 0, _qBon = 0;
var PX_CRANS = [1, 1.25, 1.5, 2];

function qualitySample(raw) {
  _qWin.push(raw);
  if (_qWin.length > 120) _qWin.shift();
}

/* On ne remonte jamais pendant la bascule (la mesure redevient bonne PARCE QU'ON A BAISSÉ :
   neuf changements en 90 s mesurés) et seulement après seize contrôles d'affilée sans aucune
   image longue. Descente (G1) dès que la fenêtre de deux secondes contient au moins deux
   images longues (≈ 1 %) ; une image isolée ne compte pas. */
function autoQuality() {
  if (_qWin.length < 60) return;
  var longues = 0;
  for (var i = 0; i < _qWin.length; i++) if (_qWin[i] > 0.033) longues++;
  var part = longues / _qWin.length;
  if (_qHold > 0) { _qHold--; return; }

  if (longues >= 2 && part > 0.01 && _qStep < 3) {
    _qStep++; _qBon = 0;
    applyQuality();
    _qHold = 4;                 // deux secondes de répit, puis on remesure
    _qWin.length = 0;
    return;
  }

  var penche = S2030.phases && S2030.phases.persp && S2030.phases.persp() > 0.01;
  if (longues === 0 && _qStep > 0 && !penche) {
    // seize contrôles sains d'affilée — huit secondes sans une image longue —
    // pour regagner un cran : remonter vite, c'est retomber tout de suite
    if (++_qBon >= 16) {
      _qStep--; _qBon = 0;
      applyQuality();
      _qHold = 12;
      _qWin.length = 0;
    }
  } else if (longues >= 2) _qBon = 0;    // une image longue isolée ne remet pas à zéro
}

/* Le cran automatique s'applique par-dessus le choix du joueur sans jamais
   l'écraser : S.opt.px reste ce qu'il a réglé, S.pxEff est ce qui est rendu.
   La bascule coûte un cran de plus, de façon déterministe : c'est le moment
   où le compositeur travaille le plus, et une règle fixe ne peut pas osciller
   comme le ferait une boucle de rétroaction. */
function applyQuality() {
  var voulu = S.opt.px || 1.5;
  var base = 0;
  for (var k = 0; k < PX_CRANS.length; k++) if (PX_CRANS[k] <= voulu) base = k;
  var penche = S2030.phases && S2030.phases.persp && S2030.phases.persp() > 0.01;
  var i = Math.max(0, base - _qStep - (penche ? 1 : 0));
  S.pxEff = PX_CRANS[i];
  /* On n'écrit PLUS dans S.opt : c'est l'objet enregistré dans le profil, et
     « densité des particules » est un réglage du joueur à part entière. La
     dégradation vit dans S.partEff, que le rendu lit. */
  var vp = S.opt.particles === undefined ? 1 : S.opt.particles;
  S.partEff = Math.min(vp, _qStep >= 2 ? 0.4 : (_qStep >= 1 ? 0.7 : 1));
  if (S.pxEff !== _pxApplied) { _pxApplied = S.pxEff; resizeCanvas(); }
}

/* La bascule s'installe et se retire progressivement : on ne rebascule la
   netteté qu'aux deux franchissements, pas à chaque image. */
var _penchePrec = false;
function qualityTilt() {
  var penche = !!(S2030.phases && S2030.phases.persp && S2030.phases.persp() > 0.01);
  if (penche === _penchePrec) return;
  _penchePrec = penche;
  applyQuality();
  _qWin.length = 0; _qBon = 0; _qHold = 8;
}

/* ------ cartes / niveaux */
/* Montée de niveau : 350 ms de ralenti tenu AVANT l'écran de cartes. Le
   passage était instantané — on voyait l'écran, jamais la montée. Appelé
   chaque image de jeu par frame() tant que S.lvlUps > 0. */
var _lvlSeq = 0;
function openCards() {
  if (S.phase !== 'play') return;
  var s = S.snake;
  if (_lvlSeq === 0) {
    _lvlSeq = S.t + 350;
    S.timeScale = 0.15;
    s.invuln = Math.max(s.invuln, 900);
    S2030.fx && S2030.fx.flash('#ffffff', 0.3);
    S2030.fx && S2030.fx.ring(s.x, s.y, '#ffffff', 10, 2000, { w: 6, life: 0.5 });
    S2030.phases && S2030.phases.pulse(0.08);
    S2030.audio && S2030.audio.sfx('levelup');
    haptic(14);
    return;
  }
  if (S.t < _lvlSeq) {
    S.timeScale = 0.15;
    s.invuln = Math.max(s.invuln, 300);
    return;
  }
  _lvlSeq = 0;
  S.lvlUps--;
  S.phase = 'cards';
  S.timeScale = 1; _ultEnd = -1; _ultStep = 9;   // un ultime en cours s'arrête là, comme avant
  var cards = S2030.upgrades ? S2030.upgrades.roll(3) : [];
  if (!cards.length) { S.phase = 'play'; return; }
  S2030.audio && S2030.audio.sfx('card');
  S2030.ui.showCards(cards, function (id) {
    S2030.upgrades.apply(id);
    S2030.audio && S2030.audio.sfx('card');
    S.phase = 'play';
    if (S.lvlUps > 0) setTimeout(openCards, 260);
  });
}

/* Sons « prêt » : l'ultime et le pouvoir se remplissaient en silence.
   ultReady existait dans la banque et n'était appelé nulle part. */
var _rdyUlt = 0, _rdyPow = 0, _rdyPowArm = 0;
function readyTick() {
  var full = S.ult >= (S.ultMax || 100);
  if (full) {
    if (!_rdyUlt) {
      _rdyUlt = 1;
      S2030.audio && S2030.audio.sfx('ultReady');
      S2030.ui && S2030.ui.toast && S2030.ui.toast('ULTIME PRÊT', '★ / R');
    }
  } else _rdyUlt = 0;
  if (!_rdyPow) {
    if (S.specialCd > 0) _rdyPowArm = 1;
    else if (_rdyPowArm || S.t > 2500) {
      _rdyPow = 1;
      S2030.ui && S2030.ui.toast && S2030.ui.toast('POUVOIR PRÊT', '◈ / E');
    }
  }
}

/* ------ cycle de vie */
function resetRun() {
  // graine tirée de l'horloge, sauf si une sonde de test l'impose (window.__SEED :
  // même exception que window.__S/__K/__M dans boot) — mêmes vagues d'une
  // exécution à l'autre pour la batterie de non-régression
  var sd = (typeof window !== 'undefined' && window.__SEED != null) ? (Math.floor(+window.__SEED) || 1)
         : (Math.floor(performance.now()) % 100000) + 7;
  seedRnd((S.seed = sd));
  S.snake = makeSnake();
  S.enemies.length = 0; S.bullets.length = 0; S.ebullets.length = 0;
  S.pickups.length = 0; S.drones.length = 0; S.pools.length = 0;
  S.score = 0; S.mult = 1; S.multT = 0; S.combo = 0; S.kills = 0;
  S.xp = 0; S.xpNext = 12; S.lvlUps = 0;
  S.up = {}; S.ult = 0; S.special = 0; S.specialCd = 0;
  S.coins = 0; S.level = 1; S.levelT = 0; S.intensity = 0; S.levelProgress = 0;
  S.timeScale = 1; S.boss = null; _ultEnd = -1; _ultStep = 9;
  _lvlSeq = 0; _rdyUlt = 0; _rdyPow = 0; _rdyPowArm = 0;
  mouse.on = false; mouse.acc = 0; mouse.aim = null;
  S.specialCdMax = 7000;
  S.cam.x = S.snake.x; S.cam.y = S.snake.y;
  S2030.fx && S2030.fx.reset();
  S2030.phases && S2030.phases.reset();
  S2030.weapons && S2030.weapons.reset && S2030.weapons.reset();
  S2030.enemies && S2030.enemies.reset && S2030.enemies.reset();
  S2030.upgrades && S2030.upgrades.reset && S2030.upgrades.reset();

  // déblocages permanents achetés entre deux parties
  var u = S.stats.unlocks || {};
  if (u.u_len) { S.snake.len += 3; S.snake.maxHp += 3; S.snake.hp = S.snake.len; }
  if (u.u_boost) { S.snake.boostMax = 125; S.snake.boostE = 125; }
  if (u.u_ult) S.ultMax = 80;
  if (u.u_shield) S.snake.shield = (S.snake.shield || 0) + 1;
  if (u.u_luck) S.up.f_luck = 1;

  // on démarre armé : le tir automatique s'enseigne tout seul, sans tutoriel
  S.up.frontCannon = u.u_start ? 2 : 1;
  S2030.levels && S2030.levels.start(1);
}

function startRun() {
  // la transition (plein écran, armement audio, remise à zéro) saccade par
  // nature : la mesure de qualité repart de zéro, sinon le premier cran
  // tombait dès la première seconde sur une machine parfaitement saine
  _qWin.length = 0; _qBon = 0; _qHold = 10; _qStep = 0; applyQuality();
  // bureau : la fenêtre est jouable telle quelle, F bascule le plein écran ;
  // goFullscreen() verrouille aussi le paysage, on saute les deux
  if (!S.desktop) goFullscreen();
  armAudio();                       // le bouton JOUER est un geste utilisateur valide
  S2030.audio && S2030.audio.resume();
  resetRun();
  S.phase = 'play';
  S.paused = false;
  S2030.ui.showScreen(null);
  S2030.audio && S2030.audio.start();
  requestWake();
}

/* reason 'blur' : pause subie (fenêtre inactive, onglet caché), bandeau
   distinct de la pause volontaire. Toute pause vide le clavier : une touche
   enfoncée à cet instant ne doit pas rester collée à la reprise. */
function togglePause(reason) {
  if (S.phase !== 'play' && !S.paused) return;
  S.paused = !S.paused;
  clearKeys();
  if (S2030.ui.setPauseBlur) S2030.ui.setPauseBlur(S.paused && reason === 'blur');
  S2030.ui.showScreen(S.paused ? 'pause' : null);
  if (S.paused) S2030.audio && S2030.audio.stop();
  else {
    S2030.audio && S2030.audio.start();
    if (S.phase === 'play') requestWake();
  }
}

/* Perte de focus (fenêtre, onglet, page) : plus aucune entrée ne reste
   enfoncée — ni touche, ni manche, ni bouton — et la partie se met en pause. */
function loseFocus() {
  clearKeys();
  var inp = S.input;
  inp.jx = 0; inp.jy = 0; inp.jmag = 0;
  inp.jactive = false; inp.boost = false; inp.special = false; inp.ult = false;
  touchJoy = null; touchBtns = {}; mouse.lb = false;
  if (S.snake) S.snake.boosting = false;
  S2030.ui && S2030.ui.releaseJoy && S2030.ui.releaseJoy();
  if (S.phase === 'play' && !S.paused) togglePause('blur');
}

function loadStats() {

}
