<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1021">
<title>SNAKE 2985 · Arcade synthwave</title>

<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="arcade.css?v=9f4e8acf7fa5028b">
<script defer src="arcade.js?v=9f4e8acf7fa5028b" data-music-root="audio/"></script>
</head>
<body>
<main id="poste">
  <canvas id="monde" aria-label="Serpent et arène à deux plans"></canvas>
  <header id="bandeau">
    <strong class="marque">SNAKE</strong>
    <span id="date">1976</span><span id="niveau">1 / 10</span>
    <button id="turbo" class="outil" aria-label="Activer le turbo" aria-pressed="false">Turbo</button>
    <button id="son" class="outil" aria-label="Activer le son" aria-pressed="false">Son</button><output id="points" aria-label="Score">000000</output><button id="pause" class="outil" aria-label="Pause">Ⅱ</button>
  </header>
  <aside id="duel" hidden><strong id="nom-garde"></strong><span id="etat-garde"></span><div id="integrite" role="meter" aria-label="Vie du gardien" aria-valuemin="0" aria-valuemax="100"><i></i></div></aside>
  <aside id="lecture" data-tone="normal"><span class="indication"><span id="message" role="status"></span><span id="compte-contrat" aria-hidden="true" hidden></span></span><span id="partenaire"></span></aside>
  <section id="pouces" aria-label="Pilotage panoramique">
    <div id="stick" aria-label="Manche de pilotage"><span></span><small>Cap</small></div>
    <div id="actions"><button id="surf" hidden>Surfer</button><button id="plan" aria-label="Changer de plan">⇅ <span>Plan 1</span></button><button id="nova" aria-label="Déclencher la nova"><b aria-hidden="true">✷</b> Nova <span>100 %</span></button></div>
  </section>
  <section id="rideau" role="dialog" aria-modal="true" aria-labelledby="titre">
    <canvas id="vitrine" width="690" height="288" aria-label="Projection de la recette sur des drones" hidden></canvas>
    <nav id="acces-borne" aria-label="Affichage et époques">
      <button id="immersif" type="button" aria-label="Plein écran" hidden><span aria-hidden="true">⛶</span></button>
      <button id="carte" type="button" aria-label="Carte des époques">Époques</button>
    </nav>
    <canvas id="passage" aria-hidden="true" hidden></canvas>
    <div id="bifurcation" hidden></div>
    <article>
      <div id="wordmark" aria-label="Snake 2985">SNAKE <em>2985</em></div>
      <span class="etiquette" id="rang">1976 · Le Terminal</span>
      <h1 id="titre">Arme ton serpent.</h1><p id="explication"></p><div id="options"></div>
      <div id="validations"></div>
    </article>
  </section>
</main>
<dialog id="vertical" aria-labelledby="vertical-titre" aria-describedby="vertical-date">
  <img class="rotation-jaquette" src="jaquette.webp" alt="" width="1921" height="819">
  <div class="rotation-legende">
    <span class="rotation-geste" aria-hidden="true"></span>
    <p id="vertical-date"></p>
    <h2 id="vertical-titre" tabindex="-1" autofocus>Passe en paysage.</h2>
  </div>
</dialog>
<script>
if(window.isSecureContext && location.protocol!=='file:' && 'serviceWorker' in navigator){
  const replacing=Boolean(navigator.serviceWorker.controller);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(replacing && document.body.dataset.screen==='prep' && !document.querySelector('dialog[open]'))location.reload();
  },{once:true});
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
</script>
</body>
</html>
