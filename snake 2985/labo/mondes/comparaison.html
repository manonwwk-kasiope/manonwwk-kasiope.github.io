<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNAKE 2985 · cinq mondes</title>
<style>*{box-sizing:border-box}body{margin:0;color:#ebe6dc;background:#111321;font:16px system-ui}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#373540}figure{margin:0;background:#111321}canvas{width:100%;height:auto;aspect-ratio:960/210;display:block}figcaption{padding:9px 14px;font-size:15px}b{margin-right:12px;color:#dab493}@media(max-width:580px){main{grid-template-columns:1fr}}</style><main></main><script src="mondes.js"></script><script>
const worlds=[[1976,'Salle de télémétrie'],[1985,'Ligne de nuit'],[1995,'Express des docks'],[2185,'Chantier orbital'],[2985,'Horizon des événements']];
const canvases=worlds.map(([year,name])=>{const fig=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=960;canvas.height=210;caption.innerHTML='<b>'+year+'</b>'+name;fig.append(canvas,caption);document.querySelector('main').append(fig);return [canvas.getContext('2d'),year];});
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function frame(ms){for(const [ctx,year] of canvases){SnakeMondes.draw(ctx,year,ms/1000,{look:0,nearBoss:0},reduce.matches);SnakeMondes.finish(ctx.canvas,year);}if(!reduce.matches)requestAnimationFrame(frame);}
requestAnimationFrame(frame);reduce.addEventListener('change',()=>location.reload());
</script></html>
