name: MobileSafariArcadeTests
options:
  bundleIdPrefix: org.localqa.s2985
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MobileSafariArcadeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_BUNDLE_IDENTIFIER: org.localqa.s2985.safariflows
schemes:
  MobileSafariArcadeTests:
    build:
      targets:
        MobileSafariArcadeTests: [test]
    test:
      targets: [MobileSafariArcadeTests]
