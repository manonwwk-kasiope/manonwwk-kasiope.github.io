<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuit fermé · Chambre d’essais</title><style>
:root{color-scheme:dark;background:#07121a;color:#f4faf8;font:17px/1.5 system-ui,sans-serif}body{max-width:820px;margin:auto;padding:clamp(14px,3vw,36px)}h1{font-size:clamp(30px,6vw,50px);line-height:1.1;margin:.5em 0}button,select{font:inherit;color:inherit;background:#183541;border:1px solid #649197;border-radius:10px;min-height:46px;padding:.4em .8em}button:disabled{opacity:.48}canvas{display:block;width:100%;aspect-ratio:2;background:#0b2029;border-radius:12px;margin:14px 0}.controls{display:flex;flex-wrap:wrap;gap:8px}output{display:block;min-height:3em;margin:12px 0}button:focus-visible,select:focus-visible{outline:3px solid #ffda7b}
</style></head><body><h1>Circuit fermé</h1><p>Le serpent dessine le contour. Au croisement, choisis de basculer ou de poursuivre sur le même plan.</p>
<label>Fermeture <select id="mode"><option value="exact">Exacte · traverser sa queue</option><option value="assist">Assistée · frôler un ancien segment</option></select></label>
<canvas id="arena" width="864" height="432" aria-label="Arène à deux plans, boucle du serpent et zone de décharge"></canvas>
<div class="controls"><button id="start">Dessiner la boucle</button><button id="shift" disabled>Basculer</button><button id="skip" disabled>Continuer sans basculer</button></div><output id="status" aria-live="polite"></output>
<script src="../../forge.js"></script><script src="../moteur.js"></script><script src="noeud.js"></script><script src="parcours.js"></script><script src="demo.js"></script></body></html>
