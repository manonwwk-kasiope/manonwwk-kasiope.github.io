<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chambre d’essais · Évolution 2985</title>
<style>
:root{color-scheme:dark;font:17px/1.45 'Avenir Next',system-ui,sans-serif;color:#f6f8ff;background:#07101e}*{box-sizing:border-box}body{margin:auto;max-width:900px;padding:clamp(12px,3vw,32px)}h1{font:600 clamp(28px,5vw,44px)/1.1 'Avenir Next',sans-serif;margin:.35em 0}label{display:grid;gap:4px;font-size:15px;color:#a9c3e8}header,fieldset,.actions{display:flex;align-items:end;gap:10px;flex-wrap:wrap}fieldset{border:0;padding:0;margin:14px 0}select,button{font:inherit;color:#fbfcff;border:1px solid #446584;background:#162a42;border-radius:10px;padding:8px;min-height:44px}button{cursor:pointer}button:active{background:#285779}canvas{width:100%;aspect-ratio:2;display:block;background:#0a192b;border:1px solid #3d7092;border-radius:12px}#help,#status{margin:8px 0}#help{min-height:3em;color:#dfe7f6}.actions{justify-content:space-between;margin-top:12px}.pad{display:grid;grid-template:44px 44px / repeat(3,52px);gap:4px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button{padding:0}small{color:#b9ccdc}output{display:block;font-variant-numeric:tabular-nums}button:focus-visible,select:focus-visible{outline:3px solid #ffd66b}
</style></head><body><h1>Chambre d’essais</h1><fieldset><label>Époque<select id="era"></select></label><label>Cœur<select id="core"></select></label><label>Catalyseur<select id="mod"></select></label><button id="reset">Recommencer</button></fieldset>
<p id="help"></p><canvas id="arena" width="900" height="450" aria-label="Arène de simulation, serpent cyan, drones rouges et relais doré"></canvas>
<output id="status" aria-live="off"></output><div class="actions"><div class="pad"><button data-d="0,-1" aria-label="Haut">▲</button><button data-d="-1,0" aria-label="Gauche">◀</button><button data-d="0,1" aria-label="Bas">▼</button><button data-d="1,0" aria-label="Droite">▶</button></div><button id="phase">Changer de plan</button><button id="pause">Jouer</button></div>
<small>Flèches pour piloter · Espace pour changer de plan · P pour mettre en pause. Les objets de l’autre plan apparaissent en contour.</small>
<script src="../../forge.js"></script><script src="../../vol-libre.js"></script><script src="../moteur.js"></script><script src="evolution.js"></script><script src="chambre.js"></script></body></html>
